name: Mobile iOS Validation

on:
  workflow_dispatch:
    inputs:
      app:
        description: 'App to validate'
        required: true
        type: choice
        options:
          - tikladoy
          - burgermy

jobs:
  validate:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install workspace dependencies
        run: npm install
      - name: Build TIKLADOY web
        if: inputs.app == 'tikladoy'
        run: npm run build:tikladoy
      - name: Build BURGERMY web
        if: inputs.app == 'burgermy'
        env:
          BURGERMY_BASE_PATH: ''
        run: npm run build:burgermy
      - name: Prepare TIKLADOY web assets
        if: inputs.app == 'tikladoy'
        run: |
          rm -rf mobile/tikladoy/www
          mkdir -p mobile/tikladoy/www
          cp -R apps/tikladoy/dist/. mobile/tikladoy/www/
      - name: Prepare BURGERMY web assets
        if: inputs.app == 'burgermy'
        run: |
          rm -rf mobile/burgermy/www
          mkdir -p mobile/burgermy/www
          cp -R apps/burgermy/out/. mobile/burgermy/www/
      - name: Install mobile dependencies
        working-directory: mobile/${{ inputs.app }}
        run: npm install
      - name: Add and sync iOS
        working-directory: mobile/${{ inputs.app }}
        run: |
          npx cap add ios
          npx cap sync ios
      - name: Build iOS simulator target
        working-directory: mobile/${{ inputs.app }}/ios/App
        run: xcodebuild -workspace App.xcworkspace -scheme App -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
