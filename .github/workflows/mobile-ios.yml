name: Mobile iOS Validation

on:
  workflow_dispatch:
    inputs:
      app:
        description: 'App to validate'
        required: true
        type: choice
        options:
          - tikladoy
          - burgermy

jobs:
  validate:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install workspace dependencies
        run: npm install
      - name: Build TIKLADOY web
        if: inputs.app == 'tikladoy'
        run: npm run build:tikladoy
      - name: Prepare TIKLADOY web assets
        if: inputs.app == 'tikladoy'
        run: |
          rm -rf mobile/tikladoy/www
          mkdir -p mobile/tikladoy/www
          cp -R apps/tikladoy/dist/. mobile/tikladoy/www/
      - name: Prepare BURGERMY shell
        if: inputs.app == 'burgermy'
        run: |
          mkdir -p mobile/burgermy/www
          cat > mobile/burgermy/www/index.html <<'HTML'
          <!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0b0b"><title>BURGERMY</title></head><body style="margin:0;background:#0b0b0b"><iframe src="https://burgermy.tr" style="position:fixed;inset:0;width:100%;height:100%;border:0" allow="geolocation;clipboard-write"></iframe></body></html>
          HTML
      - name: Install mobile dependencies
        working-directory: mobile/${{ inputs.app }}
        run: npm install
      - name: Add and sync iOS
        working-directory: mobile/${{ inputs.app }}
        run: |
          npx cap add ios
          npx cap sync ios
      - name: Build iOS simulator target
        working-directory: mobile/${{ inputs.app }}/ios/App
        run: xcodebuild -workspace App.xcworkspace -scheme App -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
