name: ORYVEX Core CI

on:
  push:
    branches: [main]
    paths:
      - 'apps/oryvex/**'
      - 'packages/shared/**'
      - 'package.json'
      - '.github/workflows/oryvex-ci.yml'
  pull_request:
    paths:
      - 'apps/oryvex/**'
      - 'packages/shared/**'
      - 'package.json'
      - '.github/workflows/oryvex-ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install
      - name: Build ORYVEX
        run: npm run build:oryvex
