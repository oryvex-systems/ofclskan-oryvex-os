name: OCX Domain Autopilot CI

on:
  push:
    branches: [main]
    paths:
      - 'packages/ocx-domain-autopilot/**'
      - '.github/workflows/ocx-domain-autopilot.yml'
  pull_request:
    paths:
      - 'packages/ocx-domain-autopilot/**'
      - '.github/workflows/ocx-domain-autopilot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install
      - name: Test Domain Autopilot
        run: npm --workspace @oryvex/ocx-domain-autopilot test
