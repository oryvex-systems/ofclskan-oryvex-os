name: Santiye OS Link Check

on:
  push:
    branches: [main]
    paths:
      - 'apps/oryvex-revakhali/**'
      - '.github/workflows/santiye-os-linkcheck.yml'
  pull_request:
    paths:
      - 'apps/oryvex-revakhali/**'

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate local screens and assets
        shell: bash
        run: |
          set -euo pipefail
          cd apps/oryvex-revakhali
          python3 - <<'PY'
          import pathlib,re,sys
          root=pathlib.Path('.')
          html={p.name for p in root.glob('*.html')}
          assets={p.name for p in root.iterdir() if p.is_file()}
          required={
            'index.html','finans.html','nakit-akis.html','metraj-maliyet-teklif.html',
            'yaklasik-maliyet.html','teklifler.html','kesif-revizyon.html','satin-alma.html',
            'hakedisler.html','santiye-defteri.html','mahal-ilerleme.html','resmi-surecler.html',
            'tedarikci-teklifleri.html','puantaj-maliyet.html','makine-bakim.html','sozlesme-degisiklik.html'
          }
          bad=[]
          missing=sorted(required-html)
          for p in root.glob('*.html'):
              text=p.read_text(encoding='utf-8',errors='ignore')
              for href in re.findall(r'href=["\']([^"\']+)["\']',text):
                  if href.startswith(('#','http:','https:','mailto:','tel:','javascript:')): continue
                  target=href.split('?',1)[0].split('#',1)[0] or p.name
                  if target.endswith('.html') and target not in html:
                      bad.append((p.name,href))
              for src in re.findall(r'<script[^>]+src=["\']([^"\']+)["\']',text):
                  if src.startswith(('http:','https:','//')): continue
                  target=src.split('?',1)[0].split('#',1)[0]
                  if target and target not in assets:
                      bad.append((p.name,src))
          if missing:
              print('Missing required screens:')
              for x in missing: print(' ',x)
          if bad:
              print('Broken local references:')
              for a,b in bad: print(f'  {a} -> {b}')
          if missing or bad: sys.exit(1)
          print(f'OK: {len(html)} HTML screens scanned; required screens and local references valid.')
          PY
