name: TIKLADOY V1 CI

on:
  push:
    branches: [main]
    paths:
      - 'apps/tikladoy/**'
      - 'package.json'
      - '.github/workflows/tikladoy-ci.yml'
  pull_request:
    paths:
      - 'apps/tikladoy/**'
      - 'package.json'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm install
      - name: Build TIKLADOY
        run: npm run --workspace apps/tikladoy build
