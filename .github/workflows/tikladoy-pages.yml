name: Publish ORYVEX + TIKLADOY + BURGERMY static site

on:
  push:
    branches: [main]
    paths:
      - 'apps/oryvex-revakhali/**'
      - 'apps/tikladoy/**'
      - 'apps/burgermy/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/tikladoy-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: oryvex-static-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build TIKLADOY
        run: npm run build:tikladoy
      - name: Build BURGERMY static export
        env:
          BURGERMY_BASE_PATH: /burgermy
        run: npm run build:burgermy
      - name: Assemble ORYVEX test site
        run: |
          rm -rf publish
          mkdir -p publish/tikladoy publish/burgermy
          cp -a apps/oryvex-revakhali/. publish/
          cp -a apps/tikladoy/dist/. publish/tikladoy/
          cp -a apps/burgermy/out/. publish/burgermy/
          echo 'revakhali.tr' > publish/CNAME
          touch publish/.nojekyll
      - name: Publish gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./publish
          publish_branch: gh-pages
          force_orphan: true
