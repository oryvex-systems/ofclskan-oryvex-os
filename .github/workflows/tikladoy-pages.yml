name: Publish TIKLADOY static site

on:
  push:
    branches: [main]
    paths:
      - 'apps/tikladoy/**'
      - 'package.json'
      - '.github/workflows/tikladoy-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tikladoy-static-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build TIKLADOY
        run: npm run build:tikladoy
      - name: Publish gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./apps/tikladoy/dist
          publish_branch: gh-pages
          force_orphan: true
