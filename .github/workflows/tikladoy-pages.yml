name: Publish TIKLADOY.TR

on:
  push:
    branches: [main]
    paths:
      - 'apps/tikladoy/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/tikladoy-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tikladoy-production
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build TIKLADOY as root
        env:
          TIKLADOY_BASE_PATH: /
        run: npm run build:tikladoy
      - name: Assemble tikladoy.tr site
        run: |
          rm -rf publish
          mkdir -p publish
          cp -a apps/tikladoy/dist/. publish/
          echo 'tikladoy.tr' > publish/CNAME
          touch publish/.nojekyll
      - name: Publish gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./publish
          publish_branch: gh-pages
          force_orphan: true
