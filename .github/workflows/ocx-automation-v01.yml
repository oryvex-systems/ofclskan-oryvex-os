name: OCX Automation v0.1 Pilot

on:
  push:
    branches:
      - ocx-domain-autopilot-pilot
    paths:
      - 'packages/ocx-automation-v01/**'
      - 'packages/ocx-domain-autopilot/**'
      - '.github/workflows/ocx-automation-v01.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: OCX v0.1 Unit + Syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        working-directory: packages/ocx-automation-v01
        run: npm run check
      - name: Unit tests
        working-directory: packages/ocx-automation-v01
        run: npm test
      - name: DOPLT worker syntax
        run: node --check packages/ocx-domain-autopilot/worker/ocx-doplt-worker.js

  pilot:
    name: SÖZÜNDE USTA Live Pilot
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Live pilot - DOPLT health, plan, app smoke
        working-directory: packages/ocx-automation-v01
        env:
          OCX_DOPLT_URL: https://ocx-doplt.oryvex-core.workers.dev
          OCX_PILOT_URL: https://sozundeusta.com.tr
        run: node src/pilot.mjs
