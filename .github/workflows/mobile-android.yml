name: Mobile Android Build

on:
  workflow_dispatch:
    inputs:
      app:
        description: 'App to build'
        required: true
        type: choice
        options:
          - tikladoy
          - burgermy
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'apps/tikladoy/**'
      - 'apps/burgermy/**'
      - '.github/workflows/mobile-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.app) || '["tikladoy","burgermy"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install workspace dependencies
        run: npm install
      - name: Build TIKLADOY web
        if: matrix.app == 'tikladoy'
        run: npm run build:tikladoy
      - name: Build BURGERMY web
        if: matrix.app == 'burgermy'
        env:
          BURGERMY_BASE_PATH: ''
        run: npm run build:burgermy
      - name: Prepare TIKLADOY mobile web assets
        if: matrix.app == 'tikladoy'
        run: |
          rm -rf mobile/tikladoy/www
          mkdir -p mobile/tikladoy/www
          cp -R apps/tikladoy/dist/. mobile/tikladoy/www/
      - name: Prepare BURGERMY mobile web assets
        if: matrix.app == 'burgermy'
        run: |
          rm -rf mobile/burgermy/www
          mkdir -p mobile/burgermy/www
          cp -R apps/burgermy/out/. mobile/burgermy/www/
      - name: Install mobile dependencies
        working-directory: mobile/${{ matrix.app }}
        run: npm install
      - name: Add Android project
        working-directory: mobile/${{ matrix.app }}
        run: npx cap add android
      - name: Sync Android
        working-directory: mobile/${{ matrix.app }}
        run: npx cap sync android
      - name: Force API 36
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('mobile')/'${{ matrix.app }}'/'android'/'variables.gradle'
          if p.exists():
              s=p.read_text()
              s=re.sub(r'compileSdkVersion\s*=\s*\d+','compileSdkVersion = 36',s)
              s=re.sub(r'targetSdkVersion\s*=\s*\d+','targetSdkVersion = 36',s)
              p.write_text(s)
          PY
      - name: Build release bundle
        working-directory: mobile/${{ matrix.app }}/android
        run: ./gradlew bundleRelease
      - name: Upload unsigned AAB
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-release-aab
          path: mobile/${{ matrix.app }}/android/app/build/outputs/bundle/release/*.aab
