name: Mobile Android Build

on:
  workflow_dispatch:
    inputs:
      app:
        description: 'App to build'
        required: true
        type: choice
        options:
          - tikladoy
          - burgermy
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'apps/tikladoy/**'
      - 'apps/burgermy/**'
      - '.github/workflows/mobile-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.app) || '["tikladoy","burgermy"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install workspace dependencies
        run: npm install
      - name: Build TIKLADOY web
        if: matrix.app == 'tikladoy'
        run: npm run build:tikladoy
      - name: Prepare TIKLADOY mobile web assets
        if: matrix.app == 'tikladoy'
        run: |
          rm -rf mobile/tikladoy/www
          mkdir -p mobile/tikladoy/www
          cp -R apps/tikladoy/dist/. mobile/tikladoy/www/
      - name: Prepare BURGERMY mobile shell
        if: matrix.app == 'burgermy'
        run: |
          mkdir -p mobile/burgermy/www
          cat > mobile/burgermy/www/index.html <<'HTML'
          <!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0b0b"><title>BURGERMY</title></head><body style="margin:0;background:#0b0b0b"><iframe src="https://burgermy.tr" style="position:fixed;inset:0;width:100%;height:100%;border:0" allow="geolocation;clipboard-write"></iframe></body></html>
          HTML
      - name: Install mobile dependencies
        working-directory: mobile/${{ matrix.app }}
        run: npm install
      - name: Add Android project
        working-directory: mobile/${{ matrix.app }}
        run: npx cap add android
      - name: Sync Android
        working-directory: mobile/${{ matrix.app }}
        run: npx cap sync android
      - name: Force API 36
        run: |
          python - <<'PY'
          from pathlib import Path
          for app in ['${{ matrix.app }}']:
              p=Path('mobile')/app/'android'/'variables.gradle'
              if p.exists():
                  s=p.read_text()
                  import re
                  s=re.sub(r'compileSdkVersion\s*=\s*\d+','compileSdkVersion = 36',s)
                  s=re.sub(r'targetSdkVersion\s*=\s*\d+','targetSdkVersion = 36',s)
                  p.write_text(s)
          PY
      - name: Build release bundle
        working-directory: mobile/${{ matrix.app }}/android
        run: ./gradlew bundleRelease
      - name: Upload unsigned AAB
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-release-aab
          path: mobile/${{ matrix.app }}/android/app/build/outputs/bundle/release/*.aab
