<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yaklaşık Maliyet</title><style>*{box-sizing:border-box}body{margin:0;background:#07111f;color:#eef4ff;font-family:Inter,system-ui}.w{max-width:900px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between}.b,.c{background:#0b1828;border:1px solid #1b3855;border-radius:16px}.b{padding:10px 13px;color:white;text-decoration:none}.c{padding:18px;margin-top:12px}label{display:block;color:#9aacbf;margin:11px 0}input{width:100%;padding:12px;border-radius:10px;border:1px solid #23425e;background:#071320;color:white;margin-top:5px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.total{font-size:34px;font-weight:900;color:#f7b23c}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><main class="w"><header class="top"><b>Yaklaşık Maliyet</b><a class="b" href="metraj-maliyet-teklif.html">← Geri</a></header><section class="c"><div class="grid"><label>Malzeme<input id="m" type="number" value="0"></label><label>İşçilik<input id="i" type="number" value="0"></label><label>Ekipman<input id="e" type="number" value="0"></label><label>Nakliye<input id="n" type="number" value="0"></label><label>Fire %<input id="f" type="number" value="5"></label><label>Genel Gider %<input id="g" type="number" value="10"></label><label>Risk %<input id="r" type="number" value="5"></label><label>Kâr %<input id="k" type="number" value="20"></label></div></section><section class="c"><span>Yaklaşık Teklif Tabanı</span><div id="t" class="total">₺0</div><p id="d"></p><a class="b" href="teklifler.html">Teklife dönüştür →</a></section></main><script>const ids=['m','i','e','n','f','g','r','k'];function calc(){let base=+m.value + +i.value + +e.value + +n.value,fire=base*(+f.value/100),cost=base+fire,gider=cost*(+g.value/100),risk=(cost+gider)*(+r.value/100),net=cost+gider+risk,profit=net*(+k.value/100),tot=net+profit;t.textContent=new Intl.NumberFormat('tr-TR',{style:'currency',currency:'TRY',maximumFractionDigits:0}).format(tot);d.textContent=`Doğrudan maliyet: ₺${base.toLocaleString('tr-TR')} · Fire: ₺${fire.toLocaleString('tr-TR')} · Genel gider: ₺${gider.toLocaleString('tr-TR')} · Risk: ₺${risk.toLocaleString('tr-TR')} · Kâr: ₺${profit.toLocaleString('tr-TR')}`}ids.forEach(x=>document.getElementById(x).oninput=calc);calc()</script></body></html>
