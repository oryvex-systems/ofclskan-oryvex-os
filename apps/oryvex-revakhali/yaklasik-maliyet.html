<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yaklaşık Maliyet</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#07111f;color:#eef4ff;font-family:Inter,system-ui}.w{max-width:900px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between}.b,.c{background:#0b1828;border:1px solid #1b3855;border-radius:16px}.b{padding:10px 13px;color:white;text-decoration:none}.c{padding:18px;margin-top:12px}label{display:block;color:#9aacbf;margin:11px 0}input{width:100%;padding:12px;border-radius:10px;border:1px solid #23425e;background:#071320;color:white;margin-top:5px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.total{font-size:34px;font-weight:900;color:#f7b23c}.primary{background:#f5a817;color:#07111f;border:0;padding:12px 15px;border-radius:11px;font-weight:900}.muted{color:#8ea0b7}.row{padding:10px 0;border-bottom:1px solid #17314c}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><main class="w"><header class="top"><b>Yaklaşık Maliyet</b><a class="b" href="metraj-maliyet-teklif.html">← Geri</a></header><section class="c"><label>Senaryo Adı<input id="name" value="Yeni Maliyet Senaryosu"></label><div class="grid"><label>Malzeme<input id="m" type="number" value="0"></label><label>İşçilik<input id="i" type="number" value="0"></label><label>Ekipman<input id="e" type="number" value="0"></label><label>Nakliye<input id="n" type="number" value="0"></label><label>Fire %<input id="f" type="number" value="5"></label><label>Genel Gider %<input id="g" type="number" value="10"></label><label>Risk %<input id="r" type="number" value="5"></label><label>Kâr %<input id="k" type="number" value="20"></label></div></section><section class="c"><span>Yaklaşık Teklif Tabanı</span><div id="t" class="total">₺0</div><p id="d"></p><button id="save" class="primary">Senaryoyu Kaydet</button> <a class="b" href="teklifler.html">Teklife dönüştür →</a><p id="msg" class="muted"></p></section><section class="c"><h2>Kayıtlı Senaryolar</h2><div id="list" class="muted">Yükleniyor...</div></section></main><script>const U='https://wdimzayfvtlrxljpsvza.supabase.co',K='sb_publishable_FZwX09JGrJt3Q9WXW3V1dQ_-g9aegh4',sb=window.supabase.createClient(U,K),money=x=>new Intl.NumberFormat('tr-TR',{style:'currency',currency:'TRY',maximumFractionDigits:0}).format(Number(x||0));const ids=['m','i','e','n','f','g','r','k'];let session,companyId;function vals(){return{material_cost:+m.value,labor_cost:+i.value,equipment_cost:+e.value,transport_cost:+n.value,waste_pct:+f.value,overhead_pct:+g.value,risk_pct:+r.value,profit_pct:+k.value}}function calc(){const v=vals(),base=v.material_cost+v.labor_cost+v.equipment_cost+v.transport_cost,fire=base*v.waste_pct/100,cost=base+fire,gider=cost*v.overhead_pct/100,risk=(cost+gider)*v.risk_pct/100,net=cost+gider+risk,profit=net*v.profit_pct/100,tot=net+profit;t.textContent=money(tot);d.textContent=`Doğrudan: ${money(base)} · Fire: ${money(fire)} · Genel gider: ${money(gider)} · Risk: ${money(risk)} · Kâr: ${money(profit)}`}ids.forEach(x=>document.getElementById(x).oninput=calc);calc();async function init(){const {data:{session:s}}=await sb.auth.getSession();session=s;if(!s){msg.textContent='Misafir modunda hesaplama serbest; kayıt için yetkili oturum gerekir.';list.textContent='Misafir modu.';return}const {data:mm}=await sb.from('santiye_company_members').select('company_id').eq('user_id',s.user.id).eq('active',true).limit(1).maybeSingle();companyId=mm?.company_id;await load()}async function load(){const {data,error}=await sb.from('santiye_cost_scenarios').select('*').eq('company_id',companyId).order('created_at',{ascending:false});if(error){list.textContent=error.message;return}list.innerHTML=(data||[]).map(x=>`<div class="row"><b>${x.name}</b><div class="muted">Maliyet ${money(x.total_cost)} · Teklif tabanı ${money(x.offer_total)}</div></div>`).join('')||'Senaryo yok.'}save.onclick=async()=>{if(!session||!companyId){msg.textContent='Kayıt için yetkili oturum gerekir.';return}const {error}=await sb.from('santiye_cost_scenarios').insert({company_id:companyId,name:name.value||'Maliyet Senaryosu',...vals(),created_by:session.user.id});msg.textContent=error?error.message:'Senaryo kaydedildi.';if(!error)await load()};init()</script></body></html>
