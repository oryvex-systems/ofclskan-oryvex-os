<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ORYVEX ŞANTİYE OS · Hakedişler</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#07111f;color:#eef4ff;font-family:Inter,system-ui}.w{max-width:980px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;gap:10px}.c,.b{background:#0b1828;border:1px solid #1b3855;border-radius:16px}.c{padding:18px;margin-top:12px}.b{padding:10px 13px;color:white;text-decoration:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;color:#9aacbf;margin:8px 0}input,select,textarea{width:100%;padding:11px;border-radius:10px;border:1px solid #23425e;background:#071320;color:white;margin-top:5px}.primary{background:#f5a817;color:#07111f;border:0;padding:12px 15px;border-radius:11px;font-weight:900}.row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #17314c}.muted{color:#8ea0b7}@media(max-width:620px){.grid{grid-template-columns:1fr}.row{display:block}}</style></head><body><main class="w"><header class="top"><b>Hakediş Yönetimi</b><a class="b" href="index.html">Ana Sistem</a></header><form id="f" class="c"><div class="grid"><label>Proje<select id="project" required></select></label><label>Hakediş Başlığı<input id="title" required placeholder="Örn. 1 No'lu Hakediş"></label><label>Tutar<input id="amount" type="number" min="0" step="0.01" value="0"></label><label>Vade Tarihi<input id="due" type="date"></label></div><label>Not<textarea id="note" rows="3"></textarea></label><button class="primary">Hakediş Kaydı Oluştur</button><p id="msg" class="muted"></p></form><section class="c"><h2>Hakedişler</h2><div id="list" class="muted">Yükleniyor…</div></section></main><script>const U='https://wdimzayfvtlrxljpsvza.supabase.co',K='sb_publishable_FZwX09JGrJt3Q9WXW3V1dQ_-g9aegh4',sb=window.supabase.createClient(U,K),money=v=>new Intl.NumberFormat('tr-TR',{style:'currency',currency:'TRY',maximumFractionDigits:0}).format(Number(v||0));let session,companyId;async function init(){const {data:{session:s}}=await sb.auth.getSession();session=s;if(!s){msg.textContent='Kayıt için giriş gerekli.';list.textContent='Misafir modu.';return}const {data:m}=await sb.from('santiye_company_members').select('company_id').eq('user_id',s.user.id).eq('active',true).limit(1).maybeSingle();companyId=m?.company_id;if(!companyId){msg.textContent='Aktif şirket üyeliği bulunamadı.';return}const {data:p,error}=await sb.from('santiye_projects').select('id,name').eq('company_id',companyId).order('created_at',{ascending:false});if(error){msg.textContent=error.message;return}project.innerHTML=(p||[]).map(x=>`<option value="${x.id}">${x.name}</option>`).join('');await load()}async function load(){const {data:p}=await sb.from('santiye_projects').select('id').eq('company_id',companyId);const ids=(p||[]).map(x=>x.id);if(!ids.length){list.textContent='Proje yok.';return}const {data,error}=await sb.from('santiye_progress_payments').select('*').in('project_id',ids).order('created_at',{ascending:false});if(error){list.textContent=error.message;return}list.innerHTML=(data||[]).map(x=>`<div class="row"><div><b>${x.title}</b><div class="muted">${money(x.amount)}${x.due_date?' · Vade '+x.due_date:''}</div></div><span>${x.status}</span></div>`).join('')||'Hakediş yok.'}f.onsubmit=async e=>{e.preventDefault();if(!session)return;const payload={project_id:project.value,title:title.value.trim(),amount:Number(amount.value||0),status:'pending',due_date:due.value||null,note:note.value.trim()||null,created_by:session.user.id};const {error}=await sb.from('santiye_progress_payments').insert(payload);msg.textContent=error?error.message:'Hakediş kaydı oluşturuldu.';if(!error){title.value='';amount.value='0';due.value='';note.value='';await load()}};init()</script></body></html>
