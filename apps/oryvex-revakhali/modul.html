/h2><p class="muted">Bildirimler sistem tarafından oluşturulur. Bu ekrandan okunabilir ve işaretlenebilir.</p>';$('form').innerHTML=h+(mode==='bildirim'?'':'<button class="primary" style="width:100%">Kaydet</button>');$('form').onsubmit=save}async function boot(){const {data:{session:s}}=await sb.auth.getSession();session=s;if(!s)return location.replace('giris.html');const [{data:me},{data:member}]=await Promise.all([sb.from('santiye_internal_users').select('role,active').eq('auth_user_id',s.user.id).maybeSingle(),sb.from('santiye_company_members').select('company_id,role,active').eq('user_id',s.user.id).eq('active',true).limit(1).maybeSingle()]);if(!me?.active||!member?.company_id)return location.replace('giris.html');role=me.role;companyId=member.company_id;await loadProjects();setup();await load()}async function loadProjects(){const {data:p}=await sb.from('santiye_projects').select('id,name').eq('company_id',companyId).order('created_at',{ascending:false});projects=p||[]}async function load(){const d=defs[mode]||defs.projeler;let q=sb.from(d.table).select('*');if(mode==='projeler')q=q.eq('company_id',companyId);if(['gunluk','isler','malzeme','satinalma','hakedis','fotograf'].includes(mode)&&projects.length)q=q.in('project_id',projects.map(x=>x.id));if(mode==='taseron')q=q.eq('company_id',companyId);if(mode==='bildirim')q=q.eq('user_id',session.user.id);if(['projeler','gunluk','isler','malzeme','taseron','hakedis','fotograf','bildirim'].includes(mode))q=q.order('created_at',{ascending:false});if(mode==='satinalma')q=q.order('requested_at',{ascending:false});const {data,error}=await q.limit(100);if(error){$('list').textContent=error.message;return}await render(data||[])}function pname(id){return projects.find(p=>p.id===id)?.name||'Proje'}async function render(rows){if(!rows.length){$('list').className='empty';$('list').innerHTML='Henüz kayıt yok.';return}$('list').className='';let photoUrls={};if(mode==='fotograf'){await Promise.all(rows.map(async r=>{if(!r.storage_path)return;const {data}=await sb.storage.from('santiye-photos').createSignedUrl(r.storage_path,900);photoUrls[r.id]=data?.signedUrl||'#'}))}$('list').innerHTML=rows.map(r=>{let a='',b='',actions='';if(mode==='projeler'){a=r.name;b=`${r.location||''} · %${r.progress||0} · ${r.crew_count||0} kişi · ${r.status||'active'}`;if(can('project_manager','site_manager'))actions=`<button class="btn ${r.status==='active'?'danger':'ok'}" onclick="projectStatus('${r.id}','${r.status==='active'?'paused':'active'}')">${r.status==='active'?'Duraklat':'Aktif Et'}</button>${r.status!=='completed'?`<button class="btn ok" onclick="projectStatus('${r.id}','completed')">Tamamlandı</button>`:''}`}if(mode==='gunluk'){a=pname(r.project_id);b=`${r.work_done||''} · ${r.crew_count||0} kişi · ${r.report_date||''}`}if(mode==='isler'){a=r.title;b=`${pname(r.project_id)} · ${r.category||''} · ${r.status||'open'} · ${r.due_date||''}`;if(can('project_manager','site_manager','field'))actions=r.status!=='done'?`<button class="btn ok" onclick="doneTask('${r.id}')">Tamamla</button>`:''}if(mode==='malzeme'){a=r.material_name;b=`${pname(r.project_id)} · ${r.quantity||0} ${r.unit||''} · ${r.status||'open'}`;if(can('project_manager','purchasing','site_manager'))actions=r.status==='open'?`<button class="btn ok" onclick="materialStatus('${r.id}','approved')">Onayla</button>`:r.status==='approved'?`<button class="btn" onclick="materialStatus('${r.id}','ordered')">Sipariş Verildi</button>`:r.status==='ordered'?`<button class="btn ok" onclick="materialStatus('${r.id}','delivered')">Teslim</button>`:''}if(mode==='satinalma'){a=r.title;b=`${pname(r.project_id)} · ${r.supplier||''} · ${money(r.amount)} · ${r.status||'pending'}`;if(can('project_manager','purchasing'))actions=r.status==='pending'?`<button class="btn ok" onclick="purchaseStatus('${r.id}','approved')">Onayla</button><button class="btn danger" onclick="purchaseStatus('${r.id}','rejected')">Reddet</button>`:r.status==='approved'?`<button class="btn" onclick="purchaseStatus('${r.id}','ordered')">Sipariş Verildi</button>`:r.status==='ordered'?`<button class="btn ok" onclick="purchaseStatus('${r.id}','delivered')">Teslim</button>`:''}if(mode==='taseron'){a=r.name;b=`${r.trade||''} · ${r.phone||''} · ${r.rating||0}/5 · ${r.status||'active'}`;if(can('project_manager'))actions=`<button class="btn ${r.status==='active'?'danger':'ok'}" onclick="subStatus('${r.id}','${r.status==='active'?'paused':'active'}')">${r.status==='active'?'Duraklat':'Aktif Et'}</button>`}if(mode==='hakedis'){a=r.title;b=`${pname(r.project_id)} · ${money(r.amount)} · ${r.status||'pending'} · ${r.due_date||''}`;if(can('project_manager','accounting'))actions=r.status==='pending'?`<button class="btn ok" onclick="paymentStatus('${r.id}','approved')">Onayla</button><button class="btn danger" onclick="paymentStatus('${r.id}','cancelled')">İptal</button>`:r.status==='approved'?`<button class="btn ok" onclick="paymentStatus('${r.id}','paid')">Ödendi</button>`:''}if(mode==='fotograf'){a=pname(r.project_id);b=r.caption||'Şantiye fotoğrafı';actions=`<a class="btn" href="${photoUrls[r.id]||'#'}" target="_blank" rel="noopener">Aç</a>`}if(mode==='bildirim'){a=r.title;b=r.body||'';actions=!r.is_read?`<button class="btn ok" onclick="readNote('${r.id}')">Okundu</button>`:''}return `<div class="row"><div><strong>${a}</strong><small>${b}</small></div><div class="actions">${actions}</div></div>`}).join('')}async function save(e){e.preventDefault();const f=Object.fromEntries(new FormData(e.currentTarget).entries()),uid=session.user.id;let table=defs[mode].table,payload={...f};if(mode==='projeler')payload={...f,company_id:companyId,progress:Number(f.progress||0),crew_count:Number(f.crew_count||0),contract_amount:Number(f.contract_amount||0),start_date:f.start_date||null,end_date:f.end_date||null,status:'active',created_by:uid};if(mode==='gunluk')payload={...f,crew_count:Number(f.crew_count||0),created_by:uid};if(mode==='isler')payload={...f,due_date:f.due_date||null,stat ects').update(patch).eq('id',id);if(error)return alert(error.message);await loadProjects();setup();await load()};window.readNote=async id=>{const {error}=await sb.from('santiye_notifications').update({is_read:true}).eq('id',id);if(error)return alert(error.message);await load()};boot();</script></body></html>
