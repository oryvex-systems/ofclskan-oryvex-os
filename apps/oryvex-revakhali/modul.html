['projeler','gunluk','isler','malzeme','taseron','hakedis','fotograf','bildirim'].includes(mode))q=q.order('created_at',{ascending:false});if(mode==='satinalma')q=q.order('requested_at',{ascending:false});const {data,error}=await q.limit(100);if(error){$('list').textContent=error.message;return}render(data||[])}function pname(id){return projects.find(p=>p.id===id)?.name||'Proje'}function render(rows){if(!rows.length){$('list').innerHTML='<div class="empty">Henüz kayıt yok.</div>';return}$('list').className='';$('list').innerHTML=rows.map(r=>{let a='',b='';if(mode==='projeler'){a=r.name;b=`${r.location||''} · %${r.progress||0} · ${r.crew_count||0} kişi`}if(mode==='gunluk'){a=pname(r.project_id);b=`${r.work_done||''} · ${r.crew_count||0} kişi`}if(mode==='isler'){a=r.title;b=`${pname(r.project_id)} · ${r.category||''} · ${r.status||'open'} · ${r.due_date||''}`}if(mode==='malzeme'){a=r.material_name;b=`${pname(r.project_id)} · ${r.quantity||0} ${r.unit||''} · ${r.status||'open'}`}if(mode==='satinalma'){a=r.title;b=`${pname(r.project_id)} · ${r.supplier||''} · ${money(r.amount)} · ${r.status||'pending'}`}if(mode==='taseron'){a=r.name;b=`${r.trade||''} · ${r.phone||''} · ${r.rating||0}/5`}if(mode==='hakedis'){a=r.title;b=`${pname(r.project_id)} · ${money(r.amount)} · ${r.status||'pending'} · ${r.due_date||''}`}if(mode==='fotograf'){a=pname(r.project_id);b=r.caption||'Şantiye fotoğrafı'}if(mode==='bildirim'){a=r.title;b=r.body||''}return `<div class="row"><div><strong>${a}</strong><small>${b}</small></div>${mode==='isler'&&r.status!=='done'?`<button class="btn" onclick="doneTask('${r.id}')">Tamamla</button>`:''}${mode==='bildirim'&&!r.is_read?`<button class="btn" onclick="readNote('${r.id}')">Okundu</button>`:''}${mode==='fotograf'&&r.public_url?`<a class="btn" href="${r.public_url}" target="_blank">Aç</a>`:''}</div>`}).join('')}async function save(e){e.preventDefault();const f=Object.fromEntries(new FormData(e.currentTarget).entries()),uid=session.user.id;let table=defs[mode].table,payload={...f};if(mode==='projeler'){payload={...f,progress:Number(f.progress||0),crew_count:Number(f.crew_count||0),contract_amount:Number(f.contract_amount||0),status:'active',created_by:uid}}if(mode==='gunluk')payload={...f,crew_count:Number(f.crew_count||0),created_by:uid};if(mode==='isler')payload={...f,due_date:f.due_date||null,status:'open',progress:0,created_by:uid};if(mode==='malzeme')payload={...f,quantity:Number(f.quantity||0),status:'open',created_by:uid};if(mode==='satinalma')payload={...f,amount:Number(f.amount||0),status:'pending',requested_by:uid};if(mode==='taseron')payload={...f,rating:Number(f.rating||0),status:'active',created_by:uid};if(mode==='hakedis')payload={...f,amount:Number(f.amount||0),due_date:f.due_date||null,status:'pending',created_by:uid};if(mode==='fotograf'){const file=e.currentTarget.querySelector('[name=file]').files[0],path=`${uid}/${Date.now()}-${file.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`,up=await sb.storage.from('santiye-photos').upload(path,file);if(up.error)return alert(up.error.message);const u=sb.storage.from('santiye-photos').getPublicUrl(path).data.publicUrl;payload={project_id:f.project_id,caption:f.caption,storage_path:path,public_url:u,created_by:uid}}const {error}=await sb.from(table).insert(payload);if(error)return alert(error.message);e.currentTarget.reset();setup();await load()}window.doneTask=async id=>{await sb.from('santiye_tasks').update({status:'done',progress:100,updated_at:new Date().toISOString()}).eq('id',id);load()};window.readNote=async id=>{await sb.from('santiye_notifications').update({is_read:true}).eq('id',id);load()};boot();</script></body></html>
