ofile.company_id,project_id:row.project_id,name:locName,level_type:'mahal'}).select('id').single();if(ins.error){$('msg').textContent=ins.error.message;return}loc=ins.data}delete row.location_name;row.location_id=loc.id;row.company_id=profile.company_id;const {error}=await sb.from('santiye_location_progress').insert(row);$('msg').textContent=error?error.message:'Mahal ilerlemesi kaydedildi.';if(!error)load()};boot()</script></body></html>
