ect.fromEntries((locs||[]).map(x=>[x.id,x.name]));rows.forEach(x=>x.location_name=map[x.location_id]||'Mahal')}}render(rows)}$('save').onclick=async()=>{const locName=$('loc').value.trim(),work=selectedWork(),item=work?.name||'';if(!locName||!item){$('msg').textContent='Mahal ve imalat kalemi gerekli.';return}const planned=Number($('planned').value||0),previous=Number($('prev').value||0),today=Number($('today').value||0);if(planned<=0){$('msg').textContent='Planlanan toplam miktar 0’dan büyük olmalı.';return}if(previous<0||today<0){$('msg').textContent='Miktar negatif olamaz.';return}if(previous+today>planned){$('msg').textContent='Gerçekleşen toplam miktar planlanan miktarı aşamaz.';return}const calculatedPercent=Math.min(100,(previous+today)/planned*100);$('percent').value=calculatedPercent.toFixed(2);const work=selectedWork();

<script>
(()=>{
const num=v=>{
  const n=Number(String(v??0).replace(",","."));
  return Number.isFinite(n)?n:0;
};

const clamp=(n,min,max)=>Math.min(max,Math.max(min,n));

window.ORYVEX_FIELD_CALC={
  calculate(input={}){
    const planned=Math.max(0,num(
      input.planned_quantity ??
      input.plannedQty ??
      input.quantity
    ));

    const previous=Math.max(0,num(
      input.previous_quantity ??
      input.previousQty
    ));

    const today=Math.max(0,num(
      input.today_quantity ??
      input.todayQty
    ));

    const rawCumulative=previous+today;
    const overrun=planned>0 && rawCumulative>planned;

    const progress=planned>0
      ? clamp((rawCumulative/planned)*100,0,100)
      : 0;

    const pursantaj=Math.max(0,num(
      input.pursantaj_percent ??
      input.pursantaj ??
      input.weight
    ));

    const weightedProgress=(progress*pursantaj)/100;

    return {
      planned_quantity:planned,
      previous_quantity:previous,
      today_quantity:today,
      cumulative_quantity:rawCumulative,
      progress_percent:Number(progress.toFixed(4)),
      pursantaj_percent:pursantaj,
      weighted_progress:Number(weightedProgress.toFixed(4)),
      overrun,
      overrun_quantity:overrun
        ? Number((rawCumulative-planned).toFixed(4))
        : 0
    };
  },

  normalizeRows(rows=[]){
    return (Array.isArray(rows)?rows:[]).map(row=>{
      const calc=this.calculate(row);
      return {...row,...calc};
    });
  },

  totals(rows=[]){
    const normalized=this.normalizeRows(rows);

    const pursantajTotal=normalized.reduce(
      (t,r)=>t+num(r.pursantaj_percent),0
    );

    const earnedWeight=normalized.reduce(
      (t,r)=>t+num(r.weighted_progress),0
    );

    return {
      rows:normalized,
      pursantaj_total:Number(pursantajTotal.toFixed(4)),
      physical_progress:Number(earnedWeight.toFixed(4)),
      overrun_count:normalized.filter(r=>r.overrun).length
    };
  }
};

function bridgeExistingStorage(){
  let rows=[];
  try{
    rows=JSON.parse(
      localStorage.getItem("oryvex_field_progress")||
      localStorage.getItem("santiye_location_progress")||
      "[]"
    );
  }catch(e){
    rows=[];
  }

  if(!Array.isArray(rows)) return;

  const result=window.ORYVEX_FIELD_CALC.totals(rows);

  localStorage.setItem(
    "oryvex_field_progress",
    JSON.stringify(result.rows)
  );

  localStorage.setItem(
    "santiye_location_progress",
    JSON.stringify(result.rows)
  );

  localStorage.setItem(
    "oryvex_field_progress_summary",
    JSON.stringify({
      physical_progress:result.physical_progress,
      pursantaj_total:result.pursantaj_total,
      overrun_count:result.overrun_count,
      updated_at:new Date().toISOString()
    })
  );

  window.dispatchEvent(new CustomEvent(
    "oryvex:field-progress-updated",
    {detail:result}
  ));
}

window.addEventListener("oryvex:field-progress-recalculate",
  bridgeExistingStorage
);

document.addEventListener("DOMContentLoaded",
  bridgeExistingStorage
);
})();
</script>
