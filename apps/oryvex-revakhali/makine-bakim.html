<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Makine · Kullanım · Bakım</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#07111f;color:#eef4ff;font-family:Inter,system-ui}.w{max-width:1080px;margin:auto;padding:16px}.top,.row{display:flex;gap:10px;justify-content:space-between;align-items:center}.b,.c{background:#0b1828;border:1px solid #1b3855;border-radius:16px}.b{padding:10px 13px;color:#eef4ff;text-decoration:none;font-weight:800}.c{padding:18px;margin-top:12px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}label{display:block;color:#9aacbf;margin:8px 0}input,select,textarea{width:100%;padding:11px;border-radius:10px;border:1px solid #23425e;background:#071320;color:white;margin-top:5px}.primary{background:#f5a817;color:#07111f;border:0;padding:12px 15px;border-radius:11px;font-weight:900}.muted{color:#8ea0b7}.item{padding:12px 0;border-bottom:1px solid #17314c}.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.kpi strong{display:block;font-size:26px;margin-top:5px}@media(max-width:650px){.grid,.kpis{grid-template-columns:1fr}.row{align-items:flex-start;flex-direction:column}}</style></head><body><main class="w"><header class="top"><b>Makine · Kullanım · Bakım</b><a class="b" href="finans.html">← Finans</a></header><div id="state" class="muted" style="margin-top:10px">Veriler hazırlanıyor…</div><section class="kpis"><div class="c kpi"><span class="muted">Toplam Çalışma</span><strong id="hoursKpi">0 sa</strong></div><div class="c kpi"><span class="muted">Yakıt</span><strong id="fuelKpi">0 L</strong></div><div class="c kpi"><span class="muted">İşletme + Bakım</span><strong id="costKpi">₺0</strong></div></section><section class="c"><h2>Makine Kartı</h2><div class="grid"><label>Makine Adı<input id="eqName" placeholder="Ekskavatör / Vinç / Jeneratör"></label><label>Plaka / Kod<input id="eqCode"></label><label>Tip<input id="eqType" placeholder="İş makinesi"></label><label>Proje<select id="eqProject"></select></label><label>Bakım Tarihi<input id="eqDue" type="date"></label><label>Durum<select id="eqStatus"><option value="available">Müsait</option><option value="in_use">Çalışıyor</option><option value="maintenance">Bakımda</option><option value="inactive">Pasif</option></select></label></div><button id="saveEq" class="primary">Makineyi Kaydet</button></section><section class="c"><h2>Çalışma Saati / Kullanım</h2><div class="grid"><label>Makine<select id="usageEq"></select></label><label>Proje<select id="usageProject"></select></label><label>Tarih<input id="usageDate" type="date"></label><label>Çalışma Saati<input id="workingHours" type="number" min="0" step="0.1" value="0"></label><label>Başlangıç Sayaç<input id="startMeter" type="number" step="0.1"></label><label>Bitiş Sayaç<input id="endMeter" type="number" step="0.1"></label><label>Yakıt (L)<input id="fuel" type="number" min="0" step="0.1" value="0"></label><label>İşletme Maliyeti<input id="operatingCost" type="number" min="0" step="0.01" value="0"></label></div><label>Not<textarea id="usageNote" rows="2"></textarea></label><button id="saveUsage" class="primary">Kullanımı Kaydet</button></section><section class="c"><h2>Bakım Kaydı</h2><div class="grid"><label>Makine<select id="maintEq"></select></label><label>Bakım Tarihi<input id="maintDate" type="date"></label><label>Bakım Tipi<input id="maintType" placeholder="Periyodik / Arıza / Yağ bakım"></label><label>Sayaç<input id="maintMeter" type="number" step="0.1"></label><label>Maliyet<input id="maintCost" type="number" min="0" step="0.01" value="0"></label><label>Servis / Firma<input id="vendor"></label><label>Sonraki Tarih<input id="nextDue" type="date"></label><label>Sonraki Sayaç<input id="nextMeter" type="number" step="0.1"></label></div><label>Not<textarea id="maintNote" rows="2"></textarea></label><button id="saveMaint" class="primary">Bakımı Kaydet</button><p id="msg" class="muted"></p></section><section class="c"><h2>Makine Özeti</h2><div id="list" class="muted">Yükleniyor…</div></section></main><script>const U='https://wdimzayfvtlrxljpsvza.supabase.co',K='sb_publishable_FZwX09JGrJt3Q9WXW3V1dQ_-g9aegh4',sb=window.supabase.createClient(U,K),money=x=>new Intl.NumberFormat('tr-TR',{style:'currency',currency:'TRY',maximumFractionDigits:0}).format(Number(x||0));let session,companyId,projects=[],equipment=[];const today=()=>new Date().toISOString().slice(0,10);usageDate.value=maintDate.value=today();async function init(){const {data:{session:s}}=await sb.auth.getSession();session=s;if(!s){state.textContent='Kayıt için giriş gerekli.';return}const {data:m}=await sb.from('santiye_company_members').select('company_id').eq('user_id',s.user.id).eq('active',true).limit(1).maybeSingle();companyId=m?.company_id;if(!companyId){state.textContent='Aktif şirket üyeliği bulunamadı.';return}const {data:p}=await sb.from('santiye_projects').select('id,name').eq('company_id',companyId).order('name');projects=p||[];const opts='<option value="">Genel / proje yok</option>'+projects.map(x=>`<option value="${x.id}">${x.name}</option>`).join('');eqProject.innerHTML=usageProject.innerHTML=opts;await loadEquipment();state.textContent='Canlı Supabase makine verisi'}async function loadEquipment(){const {data,error}=await sb.from('santiye_equipment').select('*').eq('company_id',companyId).order('name');if(error){msg.textContent=error.message;return}equipment=data||[];const opts=equipment.map(x=>`<option value="${x.id}">${x.name}${x.plate_or_code?' · '+x.plate_or_code:''}</option>`).join('');usageEq.innerHTML=maintEq.innerHTML=opts;await loadSummary()}async function loadSummary(){const ids=equipment.map(x=>x.id);let usages=[],maint=[];if(ids.length){const [{data:u},{data:m}]=await Promise.all([sb.from('santiye_equipment_usage').select('*').eq('company_id',companyId).order('usage_date',{ascending:false}).limit(100),sb.from('santiye_equipment_maintenance').select('*').eq('company_id',companyId).order('maintenance_date',{ascending:false}).limit(100)]);usages=u||[];maint=m||[]}const h=usages.reduce((s,x)=>s+Number(x.working_hours||0),0),f=usages.reduce((s,x)=>s+Number(x.fuel_liters||0),0),c=usages.reduce((s,x)=>s+Number(x.operating_cost||0),0)+maint.reduce((s,x)=>s+Number(x.cost_amount||0),0);hoursKpi.textContent=h.toFixed(1)+' sa';fuelKpi.textContent=f.toFixed(1)+' L';costKpi.textContent=money(c);list.innerHTML=equipment.map(x=>{const uh=usages.filter(u=>u.equipment_id===x.id).reduce((s,u)=>s+Number(u.working_hours||0),0),mc=maint.filter(m=>m.equipment_id===x.id).reduce((s,m)=>s+Number(m.cost_amount||0),0);return `<div class="item row"><div><b>${x.name}</b><div class="muted">${x.plate_or_code||'kod yok'} · ${x.status} · bakım ${x.maintenance_due||'planlanmadı'}</div></div><div><b>${uh.toFixed(1)} sa</b><div class="muted">bakım ${money(mc)}</div></div></div>`}).join('')||'Makine kaydı yok.'}saveEq.onclick=async()=>{if(!eqName.value.trim()){msg.textContent='Makine adı gerekli.';return}const {error}=await sb.from('santiye_equipment').insert({company_id:companyId,name:eqName.value.trim(),plate_or_code:eqCode.value||null,type:eqType.value||null,status:eqStatus.value,project_id:eqProject.value||null,maintenance_due:eqDue.value||null,created_by:session.user.id});msg.textContent=error?error.message:'Makine kaydedildi.';if(!error){eqName.value=eqCode.value=eqType.value='';await loadEquipment()}};saveUsage.onclick=async()=>{if(!usageEq.value){msg.textContent='Makine seç.';return}const {error}=await sb.from('santiye_equipment_usage').insert({company_id:companyId,project_id:usageProject.value||null,equipment_id:usageEq.value,usage_date:usageDate.value||today(),start_meter:startMeter.value?Number(startMeter.value):null,end_meter:endMeter.value?Number(endMeter.value):null,working_hours:Number(workingHours.value||0),fuel_liters:Number(fuel.value||0),operating_cost:Number(operatingCost.value||0),note:usageNote.value||null,created_by:session.user.id});msg.textContent=error?error.message:'Kullanım kaydedildi.';if(!error)await loadSummary()};saveMaint.onclick=async()=>{if(!maintEq.value||!maintType.value.trim()){msg.textContent='Makine ve bakım tipi gerekli.';return}const {error}=await sb.from('santiye_equipment_maintenance').insert({company_id:companyId,equipment_id:maintEq.value,maintenance_date:maintDate.value||today(),maintenance_type:maintType.value.trim(),meter_value:maintMeter.value?Number(maintMeter.value):null,cost_amount:Number(maintCost.value||0),next_due_date:nextDue.value||null,next_due_meter:nextMeter.value?Number(nextMeter.value):null,vendor:vendor.value||null,note:maintNote.value||null,created_by:session.user.id});if(!error&&nextDue.value)await sb.from('santiye_equipment').update({maintenance_due:nextDue.value}).eq('id',maintEq.value);msg.textContent=error?error.message:'Bakım kaydedildi.';if(!error)await loadEquipment()};init()</script></body></html>
