<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Keşif Revizyonları</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#07111f;color:#eef4ff;font-family:Inter,system-ui}.w{max-width:1080px;margin:auto;padding:16px}.c,.b{background:#0b1828;border:1px solid #1b3855;border-radius:16px}.c{padding:18px;margin-top:12px}.b{padding:10px 13px;color:white;text-decoration:none;cursor:pointer}.top,.row,.actions{display:flex;justify-content:space-between;gap:10px;align-items:center}.muted{color:#8ea0b7}label{display:block;color:#9aacbf;margin:10px 0}input,select,textarea{width:100%;padding:11px;border-radius:10px;border:1px solid #23425e;background:#071320;color:white;margin-top:5px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.primary{background:#f5a817;color:#07111f;border:0;font-weight:900}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:9px 6px;border-bottom:1px solid #17314c;text-align:left}.table input{min-width:100px}.money{text-align:right!important}.positive{color:#77d89a}.negative{color:#ff8c8c}.revision{padding:13px 0;border-bottom:1px solid #17314c}@media(max-width:700px){.grid{grid-template-columns:1fr}.top,.row{align-items:flex-start;flex-direction:column}}</style></head><body><main class="w"><header class="top"><div><b>Keşif Revizyonları</b><div class="muted">Eski veriyi silmeden miktar ve fiyat farklarını saklar</div></div><a class="b" href="metraj-maliyet-teklif.html">← Geri</a></header><section class="c"><div class="grid"><label>Proje<select id="project"></select></label><label>Revizyon Başlığı<input id="title" value="Keşif Revizyonu"></label><label>Durum<select id="status"><option value="draft">Taslak</option><option value="pending">Onay Bekliyor</option><option value="approved">Onaylı</option></select></label></div><label>Not<textarea id="note" rows="2"></textarea></label><p class="muted">Aşağıdaki güncel metrajı başlangıç kabul ederek revize miktar/fiyatları gir. Fark otomatik hesaplanır.</p><div id="editor" class="muted">Proje seçiliyor...</div><button id="save" class="b primary" style="margin-top:12px">Revizyonu Kaydet</button><p id="msg" class="muted"></p></section><section class="c"><h2>Revizyon Geçmişi</h2><div id="history" class="muted">Yükleniyor...</div></section></main><script>const U='https://wdimzayfvtlrxljpsvza.supabase.co',K='sb_publishable_FZwX09JGrJt3Q9WXW3V1dQ_-g9aegh4',sb=window.supabase.createClient(U,K),$=id=>document.getElementById(id),money=x=>new Intl.NumberFormat('tr-TR',{style:'currency',currency:'TRY',maximumFractionDigits:0}).format(Number(x||0));let session,companyId,measurements=[];async function init(){const {data:{session:s}}=await sb.auth.getSession();session=s;if(!s){$('msg').textContent='Kayıt için yetkili oturum gerekir.';$('editor').textContent='Misafir modu.';$('history').textContent='Misafir modu.';return}const {data:m}=await sb.from('santiye_company_members').select('company_id').eq('user_id',s.user.id).eq('active',true).limit(1).maybeSingle();companyId=m?.company_id;if(!companyId){$('msg').textContent='Aktif şirket üyeliği yok.';return}const {data:p,error}=await sb.from('santiye_projects').select('id,name').eq('company_id',companyId).order('created_at',{ascending:false});if(error){$('msg').textContent=error.message;return}$('project').innerHTML=(p||[]).map(x=>`<option value="${x.id}">${x.name}</option>`).join('');$('project').onchange=async()=>{await loadMeasurements();await loadHistory()};await loadMeasurements();await loadHistory()}async function loadMeasurements(){const pid=$('project').value;if(!pid){$('editor').textContent='Önce proje oluşturulmalı.';return}const {data,error}=await sb.from('santiye_measurements').select('*').eq('project_id',pid).order('created_at',{ascending:true});if(error){$('editor').textContent=error.message;return}measurements=data||[];$('editor').innerHTML=measurements.length?`<div style="overflow:auto"><table class="table"><thead><tr><th>Poz</th><th>İş Kalemi</th><th>Baz Miktar</th><th>Revize Miktar</th><th>Baz Fiyat</th><th>Revize Fiyat</th><th class="money">Fark</th></tr></thead><tbody>${measurements.map((x,i)=>`<tr><td>${x.item_code||'-'}</td><td><b>${x.item_name}</b><div class="muted">${x.unit||''}</div></td><td>${Number(x.quantity||0).toLocaleString('tr-TR')}</td><td><input id="rq_${i}" type="number" step="0.001" value="${Number(x.quantity||0)}" oninput="calcDelta(${i})"></td><td>${money(x.unit_price)}</td><td><input id="rp_${i}" type="number" step="0.01" value="${Number(x.unit_price||0)}" oninput="calcDelta(${i})"></td><td id="delta_${i}" class="money">${money(0)}</td></tr>`).join('')}</tbody></table></div>`:'Bu projede revize edilecek metraj yok.'}function calcDelta(i){const x=measurements[i],base=Number(x.quantity||0)*Number(x.unit_price||0),rev=Number($('rq_'+i).value||0)*Number($('rp_'+i).value||0),d=rev-base,el=$('delta_'+i);el.textContent=money(d);el.className='money '+(d>0?'positive':d<0?'negative':'')}async function loadHistory(){const pid=$('project').value;if(!pid)return;const {data,error}=await sb.from('santiye_estimate_revisions').select('id,revision_no,title,note,status,created_at').eq('project_id',pid).order('revision_no',{ascending:false});if(error){$('history').textContent=error.message;return}const out=[];for(const r of(data||[])){const {data:items}=await sb.from('santiye_estimate_revision_items').select('delta_amount').eq('revision_id',r.id);const delta=(items||[]).reduce((s,x)=>s+Number(x.delta_amount||0),0);out.push(`<div class="revision row"><div><b>R${r.revision_no} · ${r.title}</b><div class="muted">${r.status} · ${new Date(r.created_at).toLocaleDateString('tr-TR')}</div></div><strong class="${delta>=0?'positive':'negative'}">${delta>=0?'+':''}${money(delta)}</strong></div>`)}$('history').innerHTML=out.join('')||'Henüz revizyon yok.'}$('save').onclick=async()=>{if(!session||!companyId||!$('project').value||!measurements.length){$('msg').textContent='Proje ve metraj gerekli.';return}const pid=$('project').value;const {data:last}=await sb.from('santiye_estimate_revisions').select('revision_no').eq('project_id',pid).order('revision_no',{ascending:false}).limit(1).maybeSingle();const revNo=Number(last?.revision_no||0)+1;const {data:r,error}=await sb.from('santiye_estimate_revisions').insert({company_id:companyId,project_id:pid,revision_no:revNo,title:$('title').value||('Revizyon '+revNo),note:$('note').value||null,status:$('status').value,created_by:session.user.id}).select('id').single();if(error){$('msg').textContent=error.message;return}const items=measurements.map((x,i)=>({revision_id:r.id,measurement_id:x.id,item_code:x.item_code,item_name:x.item_name,unit:x.unit,base_quantity:Number(x.quantity||0),revised_quantity:Number($('rq_'+i).value||0),base_unit_price:Number(x.unit_price||0),revised_unit_price:Number($('rp_'+i).value||0)}));const {error:ie}=await sb.from('santiye_estimate_revision_items').insert(items);$('msg').textContent=ie?'Revizyon başlığı kaydedildi fakat kalemler kaydedilemedi: '+ie.message:`R${revNo} revizyonu kaydedildi.`;if(!ie){$('note').value='';await loadHistory()}};init()</script></body></html>
