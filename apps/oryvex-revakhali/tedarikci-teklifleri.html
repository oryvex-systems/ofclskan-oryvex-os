<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tedarikçi Teklif Karşılaştırma</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#07111f;color:#eef4ff;font-family:Inter,system-ui}.w{max-width:1080px;margin:auto;padding:16px}.top,.row{display:flex;gap:10px;justify-content:space-between;align-items:center}.b,.c{background:#0b1828;border:1px solid #1b3855;border-radius:16px}.b{padding:10px 13px;color:#eef4ff;text-decoration:none;font-weight:800}.c{padding:18px;margin-top:12px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}label{display:block;color:#9aacbf;margin:8px 0}input,select,textarea{width:100%;padding:11px;border-radius:10px;border:1px solid #23425e;background:#071320;color:white;margin-top:5px}.primary{background:#f5a817;color:#07111f;border:0;padding:12px 15px;border-radius:11px;font-weight:900}.muted{color:#8ea0b7}.item{padding:12px 0;border-bottom:1px solid #17314c}.score{font-weight:900;color:#f5a817}@media(max-width:650px){.grid{grid-template-columns:1fr}.row{align-items:flex-start;flex-direction:column}}</style></head><body><main class="w"><header class="top"><b>Tedarikçi Teklif Karşılaştırma</b><a class="b" href="finans.html">← Finans</a></header><section class="c"><div class="grid"><label>Proje<select id="project"></select></label><label>Teklif Turu Başlığı<input id="roundTitle" placeholder="Örn. Demir alımı 01"></label><label>Son Teklif Tarihi<input id="dueDate" type="date"></label><label>Not<input id="roundNote"></label></div><button id="createRound" class="primary">Teklif Turu Aç</button><p id="msg" class="muted"></p></section><section class="c"><div class="grid"><label>Teklif Turu<select id="round"></select></label><label>Tedarikçi<input id="supplierName" placeholder="Firma adı"></label><label>Toplam Teklif<input id="total" type="number" min="0"></label><label>Teslim Süresi (gün)<input id="delivery" type="number" min="0" value="0"></label><label>Ticari Puan (0-100)<input id="commercial" type="number" min="0" max="100" value="50"></label><label>Teknik Puan (0-100)<input id="technical" type="number" min="0" max="100" value="50"></label><label>Ödeme Şartı<input id="payment"></label><label>Garanti / Açıklama<input id="warranty"></label></div><button id="addQuote" class="primary">Teklifi Kaydet</button></section><section class="c"><h2>Karşılaştırma</h2><div id="list" class="muted">Yükleniyor…</div></section></main><script>const U='https://wdimzayfvtlrxljpsvza.supabase.co',K='sb_publishable_FZwX09JGrJt3Q9WXW3V1dQ_-g9aegh4',sb=window.supabase.createClient(U,K),money=x=>new Intl.NumberFormat('tr-TR',{style:'currency',currency:'TRY',maximumFractionDigits:0}).format(Number(x||0));let session,companyId;async function init(){const {data:{session:s}}=await sb.auth.getSession();session=s;if(!s){msg.textContent='Kayıt için giriş gerekli.';list.textContent='Misafir modu.';return}const {data:m}=await sb.from('santiye_company_members').select('company_id').eq('user_id',s.user.id).eq('active',true).limit(1).maybeSingle();companyId=m?.company_id;if(!companyId){msg.textContent='Aktif şirket üyeliği bulunamadı.';return}const {data:p}=await sb.from('santiye_projects').select('id,name').eq('company_id',companyId).order('name');project.innerHTML='<option value="">Genel / proje seç</option>'+((p||[]).map(x=>`<option value="${x.id}">${x.name}</option>`).join(''));await loadRounds()}async function loadRounds(){const {data,error}=await sb.from('santiye_supplier_quote_rounds').select('*').eq('company_id',companyId).order('created_at',{ascending:false});if(error){msg.textContent=error.message;return}round.innerHTML=(data||[]).map(x=>`<option value="${x.id}">${x.title} · ${x.status}</option>`).join('');await loadQuotes()}async function loadQuotes(){if(!round.value){list.textContent='Önce teklif turu aç.';return}const {data,error}=await sb.from('santiye_supplier_quotes').select('*').eq('round_id',round.value).order('total_amount');if(error){list.textContent=error.message;return}const arr=(data||[]).map(x=>({...x,score:(Number(x.commercial_score)+Number(x.technical_score))/2})).sort((a,b)=>b.score-a.score||a.total_amount-b.total_amount);list.innerHTML=arr.map((x,i)=>`<div class="item row"><div><b>${i+1}. ${x.supplier_name}</b><div class="muted">${money(x.total_amount)} · teslim ${x.delivery_days} gün · ${x.payment_terms||'ödeme şartı yok'}</div></div><div class="score">${x.score.toFixed(0)}/100</div></div>`).join('')||'Henüz teklif yok.'}createRound.onclick=async()=>{if(!session||!companyId)return;const {error}=await sb.from('santiye_supplier_quote_rounds').insert({company_id:companyId,project_id:project.value||null,title:roundTitle.value||'Yeni Teklif Turu',due_date:dueDate.value||null,note:roundNote.value||null,created_by:session.user.id});msg.textContent=error?error.message:'Teklif turu açıldı.';if(!error){roundTitle.value='';await loadRounds()}};addQuote.onclick=async()=>{if(!round.value){msg.textContent='Teklif turu seç.';return}const {error}=await sb.from('santiye_supplier_quotes').insert({round_id:round.value,supplier_name:supplierName.value||'Tedarikçi',total_amount:Number(total.value||0),delivery_days:Number(delivery.value||0),commercial_score:Number(commercial.value||0),technical_score:Number(technical.value||0),payment_terms:payment.value||null,warranty_text:warranty.value||null,created_by:session.user.id});msg.textContent=error?error.message:'Teklif kaydedildi.';if(!error)await loadQuotes()};round.onchange=loadQuotes;init()</script></body></html>
