<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ORYVEX ŞANTİYE OS · Kullanıcılar</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#07111f;color:#eef4ff;font-family:Inter,system-ui,-apple-system,sans-serif}.w{max-width:1100px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-weight:1000}.brand b{color:#f59e0b}.btn,.primary{border-radius:12px;padding:10px 13px;cursor:pointer;text-decoration:none}.btn{border:1px solid #1a3550;background:#0b1828;color:#9fb0c5}.primary{border:0;background:#f59e0b;color:#07111f;font-weight:1000}.hero,.card{background:#0b1828;border:1px solid #17314c;border-radius:20px}.hero{padding:22px;margin:14px 0}.hero h1{font-size:clamp(32px,6vw,54px);margin:4px 0}.muted{color:#8fa1b8}.two{display:grid;grid-template-columns:.8fr 1.2fr;gap:12px}.card{padding:18px}.form label{display:block;font-size:12px;color:#aab7c9;font-weight:800;margin:11px 0}.form input,.form select{display:block;width:100%;margin-top:6px;background:#071320;border:1px solid #1a3550;color:#eef4ff;border-radius:11px;padding:11px}.row{display:flex;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid #14283d}.row:last-child{border:0}.row small{display:block;color:#8193aa;margin-top:4px}.pill{font-size:10px;border:1px solid #1d3955;border-radius:999px;padding:5px 8px}.ok{color:#65e4ae}.off{color:#ff9b9b}.err{color:#ff9b9b;font-size:12px;min-height:20px}.hidden{display:none}@media(max-width:800px){.two{grid-template-columns:1fr}.w{padding:12px}}</style></head><body><main class="w"><header class="top"><div class="brand"><b>ORYVEX</b> ŞANTİYE OS</div><a class="btn" href="index.html">← Ana Panel</a></header><section class="hero"><div class="muted">YÖNETİCİ PANELİ</div><h1>Kullanıcı Yönetimi</h1><p class="muted">Kayıt ekranı yok. Buradan oluşturulan kullanıcı adı ve şifreyle şirket içi erişim verilir.</p></section><div id="denied" class="card hidden"><h2>Yetki gerekli</h2><p class="muted">Bu ekran yalnızca owner veya admin rolü içindir.</p></div><section id="content" class="two hidden"><form id="userForm" class="card form"><h2>Yeni Kullanıcı</h2><label>Ad Soyad<input name="display_name" required></label><label>Kullanıcı Adı<input name="username" autocomplete="off" required placeholder="ornek.kullanici"></label><label>Geçici Şifre<input name="password" type="password" minlength="8" required></label><label>Rol<select name="role"><option value="admin">Admin</option><option value="project_manager">Proje Müdürü</option><option value="site_manager">Şantiye Şefi</option><option value="accounting">Muhasebe</option><option value="purchasing">Satın Alma</option><option value="field">Saha Personeli</option><option value="viewer">Görüntüleyici</option></select></label><button class="primary" style="width:100%">Kullanıcı Oluştur</button><p id="msg" class="err"></p></form><article class="card"><div style="display:flex;justify-content:space-between;align-items:center"><h2>Kullanıcılar</h2><button id="refresh" class="btn">Yenile</button></div><div id="list" class="muted">Yükleniyor...</div></article></section></main><script>const URL='https://wdimzayfvtlrxljpsvza.supabase.co',KEY='sb_publishable_FZwX09JGrJt3Q9WXW3V1dQ_-g9aegh4',sb=window.supabase.createClient(URL,KEY),$=id=>document.getElementById(id);let session=null,me=null;async function boot(){const x=await sb.auth.getSession();session=x.data.session;if(!session)return location.replace('giris.html');const {data}=await sb.from('santiye_internal_users').select('username,display_name,role,active').eq('auth_user_id',session.user.id).maybeSingle();me=data;if(!me||!['owner','admin'].includes(me.role)){$('denied').classList.remove('hidden');return}$('content').classList.remove('hidden');await load()}async function load(){const {data,error}=await sb.from('santiye_internal_users').select('id,username,display_name,role,active,created_at').order('created_at',{ascending:false});if(error){$('list').textContent=error.message;return}$('list').innerHTML=(data||[]).map(u=>`<div class="row"><div><strong>${u.display_name||u.username}</strong><small>@${u.username} · ${u.role}</small></div><div><span class="pill ${u.active?'ok':'off'}">${u.active?'AKTİF':'PASİF'}</span> ${u.username!==me.username?`<button class="btn" onclick="toggleUser('${u.id}',${!u.active})">${u.active?'Pasif Yap':'Aktif Et'}</button>`:''}</div></div>`).join('')||'<p class="muted">Kullanıcı yok.</p>'}window.toggleUser=async(id,active)=>{const {error}=await sb.from('santiye_internal_users').update({active,updated_at:new Date().toISOString()}).eq('id',id);if(error)return alert(error.message);load()};$('refresh').onclick=load;$('userForm').onsubmit=async e=>{e.preventDefault();$('msg').textContent='';const f=Object.fromEntries(new FormData(e.currentTarget).entries());try{const r=await fetch(URL+'/functions/v1/santiye-admin-user',{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY,'Authorization':'Bearer '+session.access_token},body:JSON.stringify(f)});const j=await r.json();if(!r.ok)throw new Error(j.error||'Kullanıcı oluşturulamadı.');$('msg').style.color='#65e4ae';$('msg').textContent='Kullanıcı oluşturuldu.';e.currentTarget.reset();await load()}catch(err){$('msg').style.color='#ff9b9b';$('msg').textContent=err.message}};boot();</script></body></html>
