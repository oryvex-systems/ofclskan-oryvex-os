<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >
  <meta
    name="robots"
    content="noindex,nofollow"
  >
  <title>
    İş Makinası Takip | Taşpazar Camii
  </title>

  <style>
    *{box-sizing:border-box}

    body{
      margin:0;
      background:#f4f6f8;
      color:#17202a;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    .shell{
      width:min(1180px,calc(100% - 28px));
      margin:28px auto;
    }

    .hero{
      background:#111827;
      color:white;
      border-radius:18px;
      padding:24px;
    }

    .hero small{
      color:#f5c542;
      font-weight:700;
    }

    .hero h1{
      margin:7px 0 4px;
      font-size:28px;
    }

    .hero p{
      margin:0;
      color:#cbd5e1;
    }

    .grid{
      display:grid;
      grid-template-columns:
        repeat(4,minmax(0,1fr));
      gap:12px;
      margin-top:16px;
    }

    .card{
      background:white;
      border:1px solid #e5e7eb;
      border-radius:16px;
      padding:18px;
    }

    .label{
      color:#6b7280;
      font-size:12px;
      font-weight:700;
      text-transform:uppercase;
    }

    .value{
      margin-top:7px;
      font-size:23px;
      font-weight:800;
    }

    .panel{
      margin-top:16px;
      background:white;
      border:1px solid #e5e7eb;
      border-radius:16px;
      overflow:hidden;
    }

    .panel-head{
      padding:17px 18px;
      border-bottom:1px solid #e5e7eb;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }

    .panel-head h2{
      margin:0;
      font-size:17px;
    }

    .badge{
      padding:6px 10px;
      border-radius:999px;
      background:#fff7d6;
      color:#7a5b00;
      font-size:12px;
      font-weight:800;
    }

    table{
      width:100%;
      border-collapse:collapse;
    }

    th,td{
      padding:12px 14px;
      border-bottom:1px solid #eef0f2;
      text-align:left;
      font-size:13px;
    }

    th{
      background:#fafafa;
      color:#667085;
    }

    .empty{
      padding:32px;
      text-align:center;
      color:#667085;
    }

    .status{
      display:inline-block;
      border-radius:999px;
      padding:5px 8px;
      font-size:11px;
      font-weight:800;
    }

    .pending{
      background:#fff7d6;
      color:#7a5b00;
    }

    .approved{
      background:#e7f8ee;
      color:#166534;
    }

    .rejected{
      background:#feecec;
      color:#991b1b;
    }

    @media(max-width:800px){
      .grid{
        grid-template-columns:
          repeat(2,minmax(0,1fr));
      }

      .table-wrap{
        overflow:auto;
      }
    }
  </style>
</head>

<body>
  <main class="shell">

    <section class="hero">
      <small>TAŞPAZAR CAMİİ ŞANTİYESİ</small>
      <h1>İş Makinası Çalışma Takibi</h1>
      <p>
        JCB · Loder · Ekskavatör · Kamyon
      </p>
    </section>

    <section class="grid">

      <div class="card">
        <div class="label">JCB</div>
        <div
          class="value"
          id="jcbHours"
        >0,00 sa</div>
      </div>

      <div class="card">
        <div class="label">Loder</div>
        <div
          class="value"
          id="loaderHours"
        >0,00 sa</div>
      </div>

      <div class="card">
        <div class="label">Ekskavatör</div>
        <div
          class="value"
          id="excavatorHours"
        >0,00 sa</div>
      </div>

      <div class="card">
        <div class="label">Kamyon</div>
        <div
          class="value"
          id="truckHours"
        >0,00 sa</div>
      </div>

    </section>

    <section class="panel">

      <div class="panel-head">
        <h2>Çalışma Fişleri</h2>
        <span class="badge">
          Onaylı kayıtlar kesin toplama girer
        </span>
      </div>

      <div class="table-wrap">

        <table>
          <thead>
            <tr>
              <th>Tarih</th>
              <th>Fiş</th>
              <th>Makina</th>
              <th>İş Kalemi</th>
              <th>Saat</th>
              <th>Durum</th>
            </tr>
          </thead>

          <tbody id="rows">
            <tr>
              <td
                colspan="6"
                class="empty"
              >
                Veri bağlantısı aktivasyon
                aşamasında bağlanacaktır.
              </td>
            </tr>
          </tbody>
        </table>

      </div>
    </section>

  </main>

  <script src="./session-watch.js"></script>
  <script src="./global-nav.js"></script>
</body>
</html>
