<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sözleşme · Değişiklik Yönetimi</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#07111f;color:#eef4ff;font-family:Inter,system-ui}.w{max-width:1040px;margin:auto;padding:16px}.top,.row{display:flex;gap:10px;justify-content:space-between;align-items:center}.b,.c{background:#0b1828;border:1px solid #1b3855;border-radius:16px}.b{padding:10px 13px;color:#eef4ff;text-decoration:none;font-weight:800}.c{padding:18px;margin-top:12px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}label{display:block;color:#9aacbf;margin:8px 0}input,select,textarea{width:100%;padding:11px;border-radius:10px;border:1px solid #23425e;background:#071320;color:white;margin-top:5px}.primary{background:#f5a817;color:#07111f;border:0;padding:12px 15px;border-radius:11px;font-weight:900}.secondary{background:#17314c;color:#eef4ff;border:1px solid #31587d;padding:9px 12px;border-radius:10px;font-weight:800}.muted{color:#8ea0b7}.item{padding:12px 0;border-bottom:1px solid #17314c}.positive{color:#78d79b}.negative{color:#ff8c8c}.badge{padding:5px 8px;border-radius:999px;background:#13263a;font-size:12px}@media(max-width:650px){.grid{grid-template-columns:1fr}.row{align-items:flex-start;flex-direction:column}}</style></head><body><main class="w"><header class="top"><b>Sözleşme · Değişiklik Yönetimi</b><a class="b" href="finans.html">← Finans</a></header><div id="state" class="muted" style="margin-top:10px">Veriler hazırlanıyor…</div><section class="c"><div class="grid"><label>Proje<select id="project"></select></label><label>Değişiklik No<input id="changeNo" type="number" min="1" value="1"></label><label>Başlık<input id="title" placeholder="İlave imalat / süre uzatımı"></label><label>Tutar Farkı<input id="amountDelta" type="number" step="0.01" value="0"></label><label>Süre Farkı (gün)<input id="durationDelta" type="number" value="0"></label><label>Durum<select id="status"><option value="draft">Taslak</option><option value="pending">Onay Bekliyor</option><option value="approved">Onaylandı</option><option value="rejected">Reddedildi</option></select></label></div><label>Açıklama<textarea id="description" rows="3"></textarea></label><button id="save" class="primary">Değişikliği Kaydet</button><p id="msg" class="muted"></p></section><section class="c"><h2>Değişiklik Kayıtları</h2><div id="summary" class="muted"></div><div id="list" class="muted">Yükleniyor…</div></section></main><script>const U='https://wdimzayfvtlrxljpsvza.supabase.co',K='sb_publishable_FZwX09JGrJt3Q9WXW3V1dQ_-g9aegh4',sb=window.supabase.createClient(U,K),money=x=>new Intl.NumberFormat('tr-TR',{style:'currency',currency:'TRY',maximumFractionDigits:0}).format(Number(x||0));let session,companyId,rows=[];async function init(){const {data:{session:s}}=await sb.auth.getSession();session=s;if(!s){state.textContent='Kayıt için giriş gerekli.';return}const {data:m}=await sb.from('santiye_company_members').select('company_id').eq('user_id',s.user.id).eq('active',true).limit(1).maybeSingle();companyId=m?.company_id;if(!companyId){state.textContent='Aktif şirket üyeliği bulunamadı.';return}const {data:p,error:e}=await sb.from('santiye_projects').select('id,name').eq('company_id',companyId).order('name');if(e){state.textContent=e.message;return}project.innerHTML='<option value="">Proje seç</option>'+(p||[]).map(x=>`<option value="${x.id}">${x.name}</option>`).join('');state.textContent='Canlı Supabase sözleşme değişiklik verisi'}async function load(){if(!project.value){list.textContent='Proje seç.';summary.textContent='';return}const {data,error}=await sb.from('santiye_contract_changes').select('*').eq('company_id',companyId).eq('project_id',project.value).order('change_no');if(error){list.textContent=error.message;return}rows=data||[];const approved=rows.filter(x=>x.status==='approved'),amount=approved.reduce((s,x)=>s+Number(x.amount_delta||0),0),days=approved.reduce((s,x)=>s+Number(x.duration_delta_days||0),0);summary.innerHTML=`Onaylı toplam fark: <b class="${amount>=0?'positive':'negative'}">${money(amount)}</b> · süre farkı <b>${days} gün</b>`;list.innerHTML=rows.map(x=>`<div class="item row"><div><b>REV-${x.change_no} · ${x.title}</b><div class="muted">${x.description||'Açıklama yok'} · ${x.duration_delta_days} gün</div></div><div style="text-align:right"><b class="${Number(x.amount_delta)>=0?'positive':'negative'}">${money(x.amount_delta)}</b><div><span class="badge">${x.status}</span>${x.status!=='approved'?` <button class="secondary" onclick="approve('${x.id}')">Onayla</button>`:''}</div></div></div>`).join('')||'Değişiklik kaydı yok.';changeNo.value=(rows.reduce((m,x)=>Math.max(m,Number(x.change_no||0)),0)+1)}save.onclick=async()=>{if(!project.value||!title.value.trim()){msg.textContent='Proje ve başlık gerekli.';return}const payload={company_id:companyId,project_id:project.value,change_no:Number(changeNo.value||1),title:title.value.trim(),description:description.value||null,amount_delta:Number(amountDelta.value||0),duration_delta_days:Number(durationDelta.value||0),status:status.value,created_by:session.user.id};if(status.value==='approved'){payload.approved_by=session.user.id;payload.approved_at=new Date().toISOString()}const {error}=await sb.from('santiye_contract_changes').insert(payload);msg.textContent=error?error.message:'Değişiklik kaydedildi.';if(!error){title.value=description.value='';amountDelta.value=durationDelta.value=0;status.value='draft';await load()}};async function approve(id){const {error}=await sb.from('santiye_contract_changes').update({status:'approved',approved_by:session.user.id,approved_at:new Date().toISOString(),updated_at:new Date().toISOString()}).eq('id',id);msg.textContent=error?error.message:'Değişiklik onaylandı.';if(!error)await load()}project.onchange=load;init()</script></body></html>
