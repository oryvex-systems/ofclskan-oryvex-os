<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07111f"><title>ORYVEX ŞANTİYE OS · Proje Detayı</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#07111f;color:#eef4ff;font-family:Inter,system-ui,-apple-system,sans-serif}.w{max-width:1180px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;top:0;background:#07111fee;backdrop-filter:blur(12px);padding:10px 0;z-index:4}.brand{font-weight:1000}.brand b{color:#f59e0b}.btn,.primary{border-radius:12px;padding:10px 13px;text-decoration:none;cursor:pointer}.btn{border:1px solid #1a3550;background:#0b1828;color:#9fb0c5}.primary{border:0;background:#f59e0b;color:#07111f;font-weight:1000}.hero,.card{background:#0b1828;border:1px solid #17314c;border-radius:20px}.hero{padding:22px;margin:12px 0;background:linear-gradient(135deg,#0d2239,#091827)}.eyebrow{color:#f8b83f;font-size:10px;font-weight:900;letter-spacing:.15em}.hero h1{font-size:clamp(34px,6vw,58px);line-height:1;margin:7px 0}.muted{color:#8fa1b8;line-height:1.5}.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.pill{font-size:11px;border:1px solid #1d3955;border-radius:999px;padding:7px 10px}.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.card{padding:16px}.kpi span{color:#8496ad;font-size:11px}.kpi strong{display:block;font-size:25px;margin-top:6px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.row{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid #14283d}.row:last-child{border:0}.row small{display:block;color:#8092aa;margin-top:4px}.bar{height:8px;background:#142a41;border-radius:99px;overflow:hidden;margin-top:12px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#f59e0b,#ffd16a)}.manage{display:none;margin-top:10px}.formline{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end}.formline label{font-size:11px;color:#9eafc3}.formline input,.formline select{display:block;width:100%;margin-top:5px;padding:10px;border:1px solid #1a3550;border-radius:11px;background:#071320;color:#eef4ff}.bad{color:#ff9b9b}.empty{color:#7689a1;padding:12px 0}.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.photo{display:block;text-decoration:none;color:#eef4ff;border:1px solid #17314c;border-radius:14px;overflow:hidden;background:#071320}.photo img{display:block;width:100%;height:130px;object-fit:cover}.photo div{padding:8px;font-size:11px}@media(max-width:900px){.kpis{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.photos{grid-template-columns:1fr 1fr}}@media(max-width:560px){.w{padding:10px}.top{align-items:flex-start}.formline{grid-template-columns:1fr}.photos{grid-template-columns:1fr 1fr}.hero{padding:18px}}</style></head><body><main class="w"><header class="top"><div class="brand"><b>ORYVEX</b> ŞANTİYE OS</div><div><a class="btn" href="modul.html?m=projeler">← Projeler</a> <a class="btn" href="index.html">Ana Panel</a></div></header><section class="hero"><div class="eyebrow">PROJE KONTROL MERKEZİ</div><h1 id="name">Yükleniyor...</h1><div id="location" class="muted"></div><div class="bar"><i id="progressBar" style="width:0%"></i></div><div id="meta" class="meta"></div></section><section class="kpis"><article class="card kpi"><span>Açık İş</span><strong id="tasks">—</strong></article><article class="card kpi"><span>Açık Malzeme</span><strong id="materials">—</strong></article><article class="card kpi"><span>Bekleyen Satın Alma</span><strong id="purchases">—</strong></article><article class="card kpi"><span>Hakediş</span><strong id="payments">—</strong></article><article class="card kpi"><span>Toplam Gider</span><strong id="expenses">—</strong></article></section><section id="manage" class="card manage"><h2>Proje Durumu</h2><form id="projectForm" class="formline"><label>İlerleme %<input name="progress" type="number" min="0" max="100"></label><label>Durum<select name="status"><option value="active">Aktif</option><option value="paused">Duraklatıldı</option><option value="completed">Tamamlandı</option></select></label><button class="primary">Güncelle</button></form><div id="formMsg" class="muted" style="margin-top:8px"></div></section><section class="grid"><article class="card"><h2>İş Programı</h2><div id="taskList"></div></article><article class="card"><h2>Günlük Kayıtlar</h2><div id="dailyList"></div></article><article class="card"><h2>Malzeme & Satın Alma</h2><div id="procList"></div></article><article class="card"><h2>Hakediş & Gider</h2><div id="moneyList"></div></article><article class="card"><h2>Evraklar</h2><div id="documentList"></div></article><article class="card"><h2>Şantiye Fotoğrafları</h2><div id="photoList" class="photos"></div></article></section></main><script>const URL='https://wdimzayfvtlrxljpsvza.supabase.co',KEY='sb_publishable_FZwX09JGrJt3Q9WXW3V1dQ_-g9aegh4',sb=window.supabase.createClient(URL,KEY),$=x=>document.getElementById(x),money=n=>new Intl.NumberFormat('tr-TR',{style:'currency',currency:'TRY',maximumFractionDigits:0}).format(Number(n||0));const projectId=new URLSearchParams(location.search).get('id');let session=null,project=null,role='viewer',companyId=null;const row=(a,b='')=>`<div class="row"><div><strong>${a}</strong><small>${b}</small></div></div>`;const empty='<div class="empty">Kayıt yok.</div>';async function boot(){if(!projectId){$('name').textContent='Proje bulunamadı';return}const {data:{session:s}}=await sb.auth.getSession();session=s;if(!s)return location.replace('giris.html');const [{data:me},{data:member}]=await Promise.all([sb.from('santiye_internal_users').select('role,active').eq('auth_user_id',s.user.id).maybeSingle(),sb.from('santiye_company_members').select('company_id,active').eq('user_id',s.user.id).eq('active',true).limit(1).maybeSingle()]);if(!me?.active||!member?.company_id)return location.replace('giris.html');role=me.role;companyId=member.company_id;const {data:p,error}=await sb.from('santiye_projects').select('*').eq('id',projectId).eq('company_id',companyId).maybeSingle();if(error||!p){$('name').textContent='Bu projeye erişilemiyor';$('location').textContent=error?.message||'Proje bulunamadı.';return}project=p;renderProject();await loadAll()}function renderProject(){$('name').textContent=project.name;$('location').textContent=project.location||'Konum belirtilmedi';$('progressBar').style.width=Math.max(0,Math.min(100,Number(project.progress||0)))+'%';$('meta').innerHTML=`<span class="pill">%${project.progress||0} ilerleme</span><span class="pill">${project.crew_count||0} personel</span><span class="pill">${project.status||'active'}</span><span class="pill">Sözleşme ${money(project.contract_amount)}</span><span class="pill">${project.start_date||'—'} → ${project.end_date||'—'}</span>`;if(['owner','admin','project_manager','site_manager'].includes(role)){$('manage').style.display='block';$('projectForm').progress.value=project.progress||0;$('projectForm').status.value=project.status||'active'}}async function loadAll(){const [t,d,m,p,h,e,docs,photos]=await Promise.all([sb.from('santiye_tasks').select('*').eq('project_id',projectId).order('created_at',{ascending:false}).limit(8),sb.from('santiye_daily_reports').select('*').eq('project_id',projectId).order('created_at',{ascending:false}).limit(8),sb.from('santiye_material_requests').select('*').eq('project_id',projectId).order('created_at',{ascending:false}).limit(8),sb.from('santiye_purchase_requests').select('*').eq('project_id',projectId).order('requested_at',{ascending:false}).limit(8),sb.from('santiye_progress_payments').select('*').eq('project_id',projectId).order('created_at',{ascending:false}).limit(8),sb.from('santiye_expenses').select('*').eq('project_id',projectId).order('expense_date',{ascending:false}).limit(8),sb.from('santiye_documents').select('*').eq('project_id',projectId).order('created_at',{ascending:false}).limit(8),sb.from('santiye_photos').select('*').eq('project_id',projectId).order('created_at',{ascending:false}).limit(6)]);const tasks=t.data||[],daily=d.data||[],materials=m.data||[],purchases=p.data||[],payments=h.data||[],expenses=e.data||[],documents=docs.data||[],photoRows=photos.data||[];$('tasks').textContent=tasks.filter(x=>x.status!=='done').length;$('materials').textContent=materials.filter(x=>!['delivered','cancelled'].includes(x.status)).length;$('purchases').textContent=purchases.filter(x=>x.status==='pending').length;$('payments').textContent=money(payments.reduce((a,x)=>a+Number(x.amount||0),0));$('expenses').textContent=money(expenses.reduce((a,x)=>a+Number(x.amount||0),0));$('taskList').innerHTML=tasks.length?tasks.map(x=>row(x.title,`${x.status} · ${x.priority} · ${x.due_date||'termin yok'} · %${x.progress||0}`)).join(''):empty;$('dailyList').innerHTML=daily.length?daily.map(x=>row(x.work_done,`${x.report_date||''} · ${x.crew_count||0} kişi${x.note?' · '+x.note:''}`)).join(''):empty;$('procList').innerHTML=(materials.length||purchases.length)?[...materials.slice(0,4).map(x=>row('🧱 '+x.material_name,`${x.quantity||0} ${x.unit||''} · ${x.status}`)),...purchases.slice(0,4).map(x=>row('🛒 '+x.title,`${money(x.amount)} · ${x.supplier||'tedarikçi yok'} · ${x.status}`))].join(''):empty;$('moneyList').innerHTML=(payments.length||expenses.length)?[...payments.slice(0,4).map(x=>row('Hakediş · '+x.title,`${money(x.amount)} · ${x.status}`)),...expenses.slice(0,4).map(x=>row('Gider · '+(x.description||x.category||'Gider'),`${money(x.amount)} · ${x.expense_date||''}`))].join(''):empty;$('documentList').innerHTML=documents.length?documents.map(x=>`<div class="row"><div><strong>${x.title}</strong><small>${x.document_type||'Evrak'}${x.expiry_date?' · Son: '+x.expiry_date:''}</small></div>${x.file_url?`<a class="btn" href="${x.file_url}" target="_blank" rel="noopener noreferrer">Aç</a>`:''}</div>`).join(''):empty;const signed=await Promise.all(photoRows.map(async x=>{const {data}=await sb.storage.from('santiye-photos').createSignedUrl(x.storage_path,900);return {...x,url:data?.signedUrl||''}}));$('photoList').innerHTML=signed.length?signed.map(x=>`<a class="photo" href="${x.url||'#'}" target="_blank" rel="noopener noreferrer"><img src="${x.url||''}" alt="${x.caption||'Şantiye fotoğrafı'}"><div>${x.caption||'Şantiye fotoğrafı'}</div></a>`).join(''):empty} $('projectForm').onsubmit=async e=>{e.preventDefault();if(!project)return;const f=new FormData(e.currentTarget),progress=Math.max(0,Math.min(100,Number(f.get('progress')||0))),status=String(f.get('status')||'active'),patch={progress,status,updated_at:new Date().toISOString()};if(status==='completed')patch.progress=100;const {data,error}=await sb.from('santiye_projects').update(patch).eq('id',projectId).eq('company_id',companyId).select('*').single();if(error){$('formMsg').className='bad';$('formMsg').textContent=error.message;return}project=data;$('formMsg').className='muted';$('formMsg').textContent='Proje güncellendi.';renderProject();await loadAll()};boot();</script></body></html>
