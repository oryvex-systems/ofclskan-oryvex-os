<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Puantaj & İşçilik Maliyeti</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#07111f;color:#eef4ff;font-family:Inter,system-ui}.w{max-width:1050px;margin:auto;padding:16px}.top,.row{display:flex;gap:10px;justify-content:space-between;align-items:center}.b,.c{background:#0b1828;border:1px solid #1b3855;border-radius:16px}.b{padding:10px 13px;color:#eef4ff;text-decoration:none;font-weight:800}.c{padding:18px;margin-top:12px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}label{display:block;color:#9aacbf;margin:8px 0}input,select{width:100%;padding:11px;border-radius:10px;border:1px solid #23425e;background:#071320;color:white;margin-top:5px}.primary{background:#f5a817;color:#07111f;border:0;padding:12px 15px;border-radius:11px;font-weight:900}.muted{color:#8ea0b7}.item{padding:12px 0;border-bottom:1px solid #17314c}.total{font-size:30px;font-weight:900;color:#f5a817}@media(max-width:650px){.grid{grid-template-columns:1fr}.row{align-items:flex-start;flex-direction:column}}</style></head><body><main class="w"><header class="top"><b>Puantaj & İşçilik Maliyeti</b><a class="b" href="finans.html">← Finans</a></header><section class="c"><div class="grid"><label>Proje<select id="project"></select></label><label>Personel<select id="personnel"></select></label><label>Tarih<input id="workDate" type="date"></label><label>Çalışan Adı<input id="workerName"></label><label>Normal Saat<input id="hours" type="number" min="0" value="8"></label><label>Fazla Mesai<input id="overtime" type="number" min="0" value="0"></label><label>Saat Ücreti<input id="rate" type="number" min="0" value="0"></label><label>Mesai Saat Ücreti<input id="overtimeRate" type="number" min="0" value="0"></label></div><button id="save" class="primary">Puantaj Kaydet</button><p id="msg" class="muted"></p></section><section class="c"><div class="row"><h2>Kayıtlar</h2><div id="grand" class="total">₺0</div></div><div id="list" class="muted">Yükleniyor…</div></section></main><script>const U='https://wdimzayfvtlrxljpsvza.supabase.co',K='sb_publishable_FZwX09JGrJt3Q9WXW3V1dQ_-g9aegh4',sb=window.supabase.createClient(U,K),money=x=>new Intl.NumberFormat('tr-TR',{style:'currency',currency:'TRY',maximumFractionDigits:0}).format(Number(x||0));let session,companyId;workDate.value=new Date().toISOString().slice(0,10);async function init(){const {data:{session:s}}=await sb.auth.getSession();session=s;if(!s){msg.textContent='Kayıt için giriş gerekli.';list.textContent='Misafir modu.';return}const {data:m}=await sb.from('santiye_company_members').select('company_id').eq('user_id',s.user.id).eq('active',true).limit(1).maybeSingle();companyId=m?.company_id;if(!companyId){msg.textContent='Aktif şirket üyeliği bulunamadı.';return}const [{data:p},{data:per}]=await Promise.all([sb.from('santiye_projects').select('id,name').eq('company_id',companyId).order('name'),sb.from('santiye_personnel').select('id,full_name,daily_rate').eq('company_id',companyId).eq('active',true).order('full_name')]);project.innerHTML=((p||[]).map(x=>`<option value="${x.id}">${x.name}</option>`).join(''));personnel.innerHTML='<option value="">Serbest personel</option>'+((per||[]).map(x=>`<option data-name="${x.full_name}" data-rate="${Number(x.daily_rate||0)/8}" value="${x.id}">${x.full_name}</option>`).join(''));personnel.onchange=()=>{const o=personnel.selectedOptions[0];if(o?.dataset.name)workerName.value=o.dataset.name;if(o?.dataset.rate)rate.value=Number(o.dataset.rate).toFixed(2)};await load()}async function load(){if(!project.value){list.textContent='Proje yok.';return}const {data,error}=await sb.from('santiye_labor_entries').select('*').eq('project_id',project.value).order('work_date',{ascending:false}).limit(100);if(error){list.textContent=error.message;return}grand.textContent=money((data||[]).reduce((s,x)=>s+Number(x.labor_cost||0),0));list.innerHTML=(data||[]).map(x=>`<div class="item row"><div><b>${x.worker_name}</b><div class="muted">${x.work_date} · ${x.hours} sa + ${x.overtime_hours} mesai</div></div><b>${money(x.labor_cost)}</b></div>`).join('')||'Puantaj kaydı yok.'}save.onclick=async()=>{if(!session||!companyId||!project.value){msg.textContent='Proje seç.';return}const {error}=await sb.from('santiye_labor_entries').insert({company_id:companyId,project_id:project.value,personnel_id:personnel.value||null,worker_name:workerName.value||'Personel',work_date:workDate.value,hours:Number(hours.value||0),overtime_hours:Number(overtime.value||0),hourly_rate:Number(rate.value||0),overtime_rate:Number(overtimeRate.value||0),created_by:session.user.id});msg.textContent=error?error.message:'Puantaj kaydedildi.';if(!error)await load()};project.onchange=load;init()</script></body></html>
