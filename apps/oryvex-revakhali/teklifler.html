<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teklifler</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#07111f;color:#eef4ff;font-family:Inter,system-ui}.w{max-width:1080px;margin:auto;padding:16px}.top,.row,.actions{display:flex;justify-content:space-between;gap:10px;align-items:center}.b,.c{background:#0b1828;border:1px solid #1b3855;border-radius:16px}.b{padding:10px 13px;color:white;text-decoration:none;cursor:pointer}.c{padding:18px;margin-top:12px}label{display:block;color:#9aacbf;margin:10px 0}input,textarea,select{width:100%;padding:12px;border-radius:10px;border:1px solid #23425e;background:#071320;color:white;margin-top:5px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.primary{background:#f5a817;color:#07111f;border:0;padding:13px 16px;border-radius:12px;font-weight:900;cursor:pointer}.row{padding:12px 0;border-bottom:1px solid #17314c;align-items:flex-start}.muted{color:#8ea0b7}.ok{background:#143322;border-color:#245d3a}.quote{padding:14px 0;border-bottom:1px solid #17314c}.quote:last-child{border-bottom:0}.pill{padding:5px 8px;border-radius:999px;background:#13263b}.money{font-size:20px;font-weight:900}.small{font-size:13px}@media(max-width:650px){.grid{grid-template-columns:1fr}.row,.top{align-items:flex-start;flex-direction:column}}</style></head><body><main class="w"><header class="top"><div><b>Teklif Oluşturma</b><div class="muted">Metrajdan teklif, tekliften proje ve bütçe</div></div><a class="b" href="metraj-maliyet-teklif.html">← Geri</a></header><form id="quoteForm" class="c"><div class="grid"><label>Müşteri / İşveren<input name="customer_name" required></label><label>Proje Adı<input name="project_name" required></label><label>Teklif No<input name="quote_no" id="quoteNo" required></label><label>Geçerlilik (gün)<input name="valid_days" type="number" value="15"></label><label>İskonto %<input name="discount_pct" type="number" value="0"></label><label>KDV %<input name="vat_pct" type="number" value="20"></label><label>Ödeme Planı<input name="payment_terms" placeholder="%30 avans..."></label><label>Yaklaşık Maliyet Senaryosu<select id="scenario" name="cost_scenario_id"><option value="">Seçme</option></select></label><label>Metraj Kaynak Projesi<select id="sourceProject"><option value="">Metraj aktarma</option></select></label><label>Durum<select name="status"><option value="draft">Taslak</option><option value="pending">Onay Bekliyor</option><option value="revised">Revize</option></select></label></div><label>Açıklama / Kapsam<textarea name="notes" rows="4"></textarea></label><button class="primary">Teklifi ve Kalemleri Kaydet</button><p id="msg" class="muted"></p></form><section class="c"><h2>Teklifler</h2><div id="list" class="muted">Yükleniyor...</div></section></main><script>const U='https://wdimzayfvtlrxljpsvza.supabase.co',K='sb_publishable_FZwX09JGrJt3Q9WXW3V1dQ_-g9aegh4',sb=window.supabase.createClient(U,K),$=id=>document.getElementById(id),money=x=>new Intl.NumberFormat('tr-TR',{style:'currency',currency:'TRY',maximumFractionDigits:0}).format(Number(x||0));let session,companyId;function nextNo(){return'ORY-'+new Date().getFullYear()+'-'+String(Date.now()).slice(-6)}$('quoteNo').value=nextNo();async function init(){const {data:{session:s}}=await sb.auth.getSession();session=s;if(!s){$('msg').textContent='Misafir modunda ekranı inceleyebilirsin; kayıt için yetkili oturum gerekir.';$('list').textContent='Misafir modu: veri kaydı kapalı.';return}const {data:m}=await sb.from('santiye_company_members').select('company_id').eq('user_id',s.user.id).eq('active',true).limit(1).maybeSingle();companyId=m?.company_id;if(!companyId){$('msg').textContent='Şirket üyeliği bulunamadı.';return}const [{data:p},{data:sx}]=await Promise.all([sb.from('santiye_projects').select('id,name').eq('company_id',companyId).order('created_at',{ascending:false}),sb.from('santiye_cost_scenarios').select('id,name,offer_total').eq('company_id',companyId).order('created_at',{ascending:false})]);$('sourceProject').innerHTML='<option value="">Metraj aktarma</option>'+(p||[]).map(x=>`<option value="${x.id}">${x.name}</option>`).join('');$('scenario').innerHTML='<option value="">Seçme</option>'+(sx||[]).map(x=>`<option value="${x.id}">${x.name} · ${money(x.offer_total)}</option>`).join('');await load()}async function quoteTotal(qid){const {data}=await sb.from('santiye_quote_items').select('quantity,unit_price,line_total').eq('quote_id',qid);return(data||[]).reduce((s,x)=>s+Number(x.line_total??Number(x.quantity||0)*Number(x.unit_price||0)),0)}async function load(){const {data,error}=await sb.from('santiye_quotes').select('*').eq('company_id',companyId).order('created_at',{ascending:false});if(error){$('list').textContent=error.message;return}const rows=await Promise.all((data||[]).map(async q=>({...q,subtotal:await quoteTotal(q.id)})));$('list').innerHTML=rows.map(q=>{const discounted=q.subtotal*(1-Number(q.discount_pct||0)/100),final=discounted*(1+Number(q.vat_pct||0)/100);return`<div class="quote"><div class="row"><div><b>${q.quote_no}</b><div>${q.customer_name} · ${q.project_name}</div><div class="muted small">${q.status}${q.project_id?' · Proje oluşturuldu':''}</div></div><div><div class="money">${money(final)}</div><div class="actions" style="margin-top:8px">${q.status==='accepted'?'<span class="pill">Kabul edildi</span>':`<button class="b ok" onclick="acceptQuote('${q.id}')">Kabul Et → Proje Oluştur</button>`}</div></div></div></div>`}).join('')||'Teklif yok.'}async function acceptQuote(id){if(!confirm('Teklif kabul edilip proje, başlangıç bütçesi ve metraj oluşturulsun mu?'))return;$('msg').textContent='Teklif projeye dönüştürülüyor...';const {data,error}=await sb.rpc('santiye_accept_quote_to_project',{p_quote_id:id});$('msg').textContent=error?error.message:`Teklif kabul edildi. Proje ID: ${data}`;if(!error)await load()}$('quoteForm').onsubmit=async e=>{e.preventDefault();if(!session||!companyId){$('msg').textContent='Kayıt için yetkili oturum gerekir.';return}const f=Object.fromEntries(new FormData(e.currentTarget));f.company_id=companyId;f.created_by=session.user.id;f.valid_days=Number(f.valid_days||15);f.discount_pct=Number(f.discount_pct||0);f.vat_pct=Number(f.vat_pct||20);if(!f.cost_scenario_id)delete f.cost_scenario_id;const sourceProject=$('sourceProject').value;const {data:q,error}=await sb.from('santiye_quotes').insert(f).select('id').single();if(error){$('msg').textContent=error.message;return}if(sourceProject){const {data:m,error:me}=await sb.from('santiye_measurements').select('id,item_code,item_name,unit,quantity,unit_price').eq('project_id',sourceProject);if(me){$('msg').textContent='Teklif kaydedildi fakat metraj okunamadı: '+me.message;await load();return}if((m||[]).length){const items=m.map((x,i)=>({quote_id:q.id,measurement_id:x.id,item_code:x.item_code,item_name:x.item_name,unit:x.unit,quantity:Number(x.quantity||0),unit_price:Number(x.unit_price||0),sort_order:i}));const {error:ie}=await sb.from('santiye_quote_items').insert(items);if(ie){$('msg').textContent='Teklif kaydedildi fakat kalem aktarımı başarısız: '+ie.message;await load();return}}}$('msg').textContent='Teklif ve kalemleri kaydedildi.';e.currentTarget.reset();$('quoteNo').value=nextNo();await init()};init()</script></body></html>
