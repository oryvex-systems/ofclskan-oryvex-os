<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teklifler</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#07111f;color:#eef4ff;font-family:Inter,system-ui}.w{max-width:980px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between}.b,.c{background:#0b1828;border:1px solid #1b3855;border-radius:16px}.b{padding:10px 13px;color:white;text-decoration:none}.c{padding:18px;margin-top:12px}label{display:block;color:#9aacbf;margin:10px 0}input,textarea,select{width:100%;padding:12px;border-radius:10px;border:1px solid #23425e;background:#071320;color:white;margin-top:5px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.primary{background:#f5a817;color:#07111f;border:0;padding:13px 16px;border-radius:12px;font-weight:900}.row{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #17314c}.muted{color:#8ea0b7}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><main class="w"><header class="top"><b>Teklif Oluşturma</b><a class="b" href="metraj-maliyet-teklif.html">← Geri</a></header><form id="quoteForm" class="c"><div class="grid"><label>Müşteri / İşveren<input name="customer_name" required></label><label>Proje Adı<input name="project_name" required></label><label>Teklif No<input name="quote_no" id="quoteNo" required></label><label>Geçerlilik (gün)<input name="valid_days" type="number" value="15"></label><label>İskonto %<input name="discount_pct" type="number" value="0"></label><label>KDV %<input name="vat_pct" type="number" value="20"></label><label>Ödeme Planı<input name="payment_terms" placeholder="%30 avans..."></label><label>Durum<select name="status"><option value="draft">Taslak</option><option value="pending">Onay Bekliyor</option><option value="revised">Revize</option><option value="accepted">Kabul</option></select></label></div><label>Açıklama / Kapsam<textarea name="notes" rows="4"></textarea></label><button class="primary">Teklif Taslağını Kaydet</button><p id="msg" class="muted"></p></form><section class="c"><h2>Teklifler</h2><div id="list" class="muted">Yükleniyor...</div></section></main><script>const U='https://wdimzayfvtlrxljpsvza.supabase.co',K='sb_publishable_FZwX09JGrJt3Q9WXW3V1dQ_-g9aegh4',sb=window.supabase.createClient(U,K);let session,companyId;quoteNo.value='ORY-'+new Date().getFullYear()+'-'+String(Date.now()).slice(-5);async function init(){const {data:{session:s}}=await sb.auth.getSession();session=s;if(!s){msg.textContent='Misafir modunda ekranı inceleyebilirsin; kayıt için yetkili oturum gerekir.';list.textContent='Misafir modu: veri kaydı kapalı.';return}const {data:m}=await sb.from('santiye_company_members').select('company_id').eq('user_id',s.user.id).eq('active',true).limit(1).maybeSingle();companyId=m?.company_id;if(!companyId){msg.textContent='Şirket üyeliği bulunamadı.';return}await load()}async function load(){const {data,error}=await sb.from('santiye_quotes').select('*').eq('company_id',companyId).order('created_at',{ascending:false});if(error){list.textContent=error.message;return}list.innerHTML=(data||[]).map(q=>`<div class="row"><div><b>${q.quote_no}</b><div class="muted">${q.customer_name} · ${q.project_name}</div></div><span>${q.status}</span></div>`).join('')||'Teklif yok.'}quoteForm.onsubmit=async e=>{e.preventDefault();if(!session||!companyId){msg.textContent='Kayıt için yetkili oturum gerekir.';return}const f=Object.fromEntries(new FormData(e.currentTarget));f.company_id=companyId;f.created_by=session.user.id;f.valid_days=Number(f.valid_days||15);f.discount_pct=Number(f.discount_pct||0);f.vat_pct=Number(f.vat_pct||20);const {error}=await sb.from('santiye_quotes').insert(f);msg.textContent=error?error.message:'Teklif kaydedildi.';if(!error){e.currentTarget.reset();quoteNo.value='ORY-'+new Date().getFullYear()+'-'+String(Date.now()).slice(-5);await load()}};init()</script></body></html>
